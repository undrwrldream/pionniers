<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="config-classe.js"></script>
<script src="garde-classe.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livre d'Histoire</title>
<script src="stockage-classe.js"></script>
<script src="passerelle-core.js"></script>
<script src="xp-core.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1a0c;
  --ink-soft:#5b4126;
  --gold:#b8892b;
  --gold-clair:#e2c06a;
  --vin:#6b1717;
  --parchemin:#f3e5c4;
  --fond:#140a05;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--fond); color:var(--ink);
  font-family:'EB Garamond', Georgia, 'Times New Roman', serif; }
body{ display:flex; align-items:center; justify-content:center; overflow:hidden; }

/* ─────────────────────────────────────────────────────────────
   Grand parchemin générique (bannière "PARCHEMINS") — même image
   et même gabarit que les pages de Parchemins de lecture :
   1568×1328, jusqu'à 97 % de la hauteur de l'écran.
   Zone d'écriture mesurée sur l'image : le texte reste sous la
   bannière (et son ombre) et au-dessus du rouleau du bas.
   ───────────────────────────────────────────────────────────── */
.parchemin-conteneur{
  position:relative; flex:none;
  width:min(90vw, calc(97vh * 1.1807), 1568px);
  aspect-ratio:1568 / 1328;
  background:url('livre_assets/parchemin_scroll_fondu.webp') center / contain no-repeat;
  container-type:inline-size;
}
#app{
  position:absolute; left:16.5%; right:16.5%; top:32%; bottom:17.5%;
  display:flex; flex-direction:column; min-height:0;
  text-align:left;
}

/* ── Écrans ── */
.ecran{ display:flex; flex-direction:column; height:100%; min-height:0; animation:apparait .28s ease-out; }
@keyframes apparait{ from{ opacity:0; transform:translateY(.5cqw); } to{ opacity:1; transform:none; } }

.titre-livre{
  margin:0; text-align:center; font-family:'Cinzel Decorative', 'EB Garamond', serif;
  font-weight:700; font-size:3.3cqw; letter-spacing:.06em; color:var(--vin); line-height:1.1;
}
.sous-titre{
  margin:.5cqw 0 0; text-align:center; font-size:1.35cqw; letter-spacing:.32em; text-transform:uppercase;
  color:var(--ink-soft); font-weight:600;
}
.ornement{
  display:flex; align-items:center; justify-content:center; gap:1cqw; margin:1.1cqw auto 1.4cqw;
  color:var(--gold); font-size:1.3cqw; width:60%;
}
.ornement::before,.ornement::after{ content:""; flex:1; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent); }

/* ── Listes (table des matières / section) ── */
.liste{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1cqw;
  overflow-y:auto; min-height:0; padding:.3cqw .6cqw .6cqw; }
.entree{
  all:unset; box-sizing:border-box; cursor:pointer; width:100%;
  display:flex; align-items:center; gap:1.6cqw; padding:1cqw 1.6cqw;
  background:rgba(255,248,228,.55); border:1px solid rgba(184,137,43,.65); border-radius:.8cqw;
  box-shadow:0 .25cqw .7cqw -.4cqw rgba(43,26,12,.45);
  transition:background .15s, transform .15s, box-shadow .15s;
}
.entree:hover,.entree:focus-visible{ background:rgba(255,244,212,.9); transform:translateY(-.15cqw);
  box-shadow:0 .5cqw 1cqw -.5cqw rgba(43,26,12,.55); }
.entree:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.entree .num{
  flex:none; width:3.6cqw; height:3.6cqw; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--gold); border-radius:50%; color:var(--vin);
  font-family:'Cinzel Decorative','EB Garamond',serif; font-weight:700; font-size:1.5cqw; background:rgba(226,192,106,.25);
}
.entree .vignette{ flex:none; width:8cqw; height:5.4cqw; object-fit:cover; border-radius:.5cqw; border:1px solid var(--gold); }
.entree .corps{ flex:1; min-width:0; }
.entree .nom{ display:block; font-size:2.1cqw; font-weight:600; color:var(--ink); line-height:1.15; }
.entree .meta{ display:block; margin-top:.25cqw; font-size:1.3cqw; color:var(--ink-soft); font-style:italic; }
.entree .fleche{ flex:none; font-size:1.8cqw; color:var(--gold); }

/* ── Fil d'Ariane ── */
.fil{ flex:none; display:flex; align-items:center; gap:1.2cqw; margin-bottom:.6cqw; min-height:2.6cqw; padding:0 3.6cqw; } /* dégage les étoiles d'angle du parchemin */
.retour{
  all:unset; cursor:pointer; flex:none; padding:.3cqw 1.1cqw; border:1px solid var(--gold); border-radius:999px;
  font-size:max(1.2cqw,11px); font-weight:600; color:var(--vin); background:rgba(255,248,228,.55); letter-spacing:.04em;
}
.retour:hover,.retour:focus-visible{ background:rgba(255,244,212,.95); }
.retour:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.chemin{ font-size:max(1.2cqw,11px); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chemin b{ color:var(--vin); font-weight:700; }
.agrandir{ margin-left:auto; }
.fig img{ cursor:zoom-in; }
/* ── Page avec vidéo : bouton ▶ par-dessus l'image, vidéo muette en plein écran, un clic à chaque fois ── */
.fig{ position:relative; }
.fig-play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:max(7cqw,56px); height:max(7cqw,56px);
  border-radius:50%; border:.3cqw solid var(--gold); background:rgba(43,26,12,.72); color:var(--parchemin); cursor:pointer;
  font-size:max(3cqw,24px); line-height:1; padding-left:.5cqw; box-shadow:0 .4cqw 1.4cqw rgba(0,0,0,.55); transition:transform .15s, background .15s; }
.fig-play:hover{ transform:translate(-50%,-50%) scale(1.08); background:rgba(107,29,29,.85); }
.fig-play:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
.video-plein{ position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; background:#000; animation:fondu .2s ease-out; }
.video-plein video{ max-width:100vw; max-height:100vh; width:100%; height:100%; object-fit:contain; }
.video-plein .zoom-x{ position:absolute; top:1.6vh; right:1.6vw; width:42px; height:42px; border-radius:50%; cursor:pointer;
  border:1px solid var(--gold); background:rgba(0,0,0,.55); color:var(--parchemin); font-size:20px; }

/* ── Lecteur ── */
.page{ flex:1; min-height:0; display:grid; gap:2.6cqw; align-items:center; padding:1.3cqw 1cqw .8cqw; animation:apparait .28s ease-out; }
.page--cote{ grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr); }
.page--portrait{ grid-template-columns:minmax(0,.62fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr); }
.page--texte{ grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); justify-items:center; }
.page--solo{ grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto; justify-items:center; gap:1.1cqw; }

.fig{ min-height:0; min-width:0; height:100%; display:flex; align-items:center; justify-content:center; }
.fig img{
  display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;
  border-radius:.6cqw; border:.28cqw solid var(--gold);
  box-shadow:0 0 0 .12cqw var(--vin), 0 .8cqw 1.6cqw -.6cqw rgba(43,26,12,.6);
  background:rgba(43,26,12,.08);
}
.texte{ min-height:0; max-height:100%; overflow-y:auto; align-self:center; padding-right:.4cqw; }
.texte p{ margin:0; font-size:max(1.95cqw,14px); line-height:1.42; font-weight:500; color:var(--ink); text-wrap:pretty; }
.page--texte .texte{ max-width:86%; text-align:center; }
.page--texte .texte p{ font-size:2.2cqw; }
.page--texte .fleuron{ display:block; margin:0 auto .9cqw; width:3.4cqw; height:3.4cqw; line-height:3.2cqw; text-align:center;
  border:1px solid var(--gold); border-radius:50%; color:var(--gold); font-size:1.6cqw; background:rgba(226,192,106,.2); }
.pastille{
  display:inline-block; margin-top:1cqw; padding:.25cqw 1cqw; border:1px solid rgba(184,137,43,.75); border-radius:999px;
  font-size:max(1.2cqw,11px); letter-spacing:.08em; color:var(--ink-soft); background:rgba(255,248,228,.55); font-style:italic;
}
.legende{
  padding:.4cqw 1.6cqw; border:1px solid rgba(184,137,43,.75); border-radius:999px; background:rgba(255,248,228,.7);
  font-size:max(1.35cqw,12px); font-weight:600; color:var(--ink); text-align:center;
}

/* ── Navigation ── */
.nav{ flex:none; display:flex; align-items:center; justify-content:space-between; gap:1.5cqw;
  margin:.4cqw 3.6cqw 0; padding-top:.9cqw; border-top:1px solid rgba(184,137,43,.55); }
.points{ display:flex; align-items:center; gap:.7cqw; }
.pt{ all:unset; cursor:pointer; width:.95cqw; height:.95cqw; border-radius:50%; background:rgba(184,137,43,.4); transition:all .2s; }
.pt:hover{ background:var(--gold); transform:scale(1.2); }
.pt:focus-visible{ outline:2px solid var(--vin); outline-offset:2px; }
.pt.actif{ width:2.4cqw; border-radius:999px; background:var(--vin); cursor:default; }
.compteur{ margin-left:.8cqw; font-size:max(1.15cqw,10.5px); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; white-space:nowrap; }
.boutons{ display:flex; gap:.9cqw; }
.btn{
  all:unset; cursor:pointer; padding:.5cqw 1.6cqw; border-radius:999px; font-size:max(1.35cqw,12px); font-weight:600; letter-spacing:.03em;
  border:1px solid var(--gold); color:var(--ink); background:rgba(255,248,228,.75); transition:all .15s;
}
.btn:hover:not([disabled]){ background:#fff6da; }
.btn.plein{ background:var(--vin); color:var(--parchemin); border-color:var(--gold); }
.btn.plein:hover:not([disabled]){ background:#521010; }
.btn[disabled]{ opacity:.38; cursor:default; }
.btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

/* ── Agrandissement plein écran d'une image (les affiches contiennent du texte) ── */
.zoom{ position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1.4vh; padding:2vh 2vw; background:rgba(12,6,3,.95); cursor:zoom-out; animation:fondu .2s ease-out; }
@keyframes fondu{ from{ opacity:0; } to{ opacity:1; } }
.zoom img{ max-width:96vw; max-height:88vh; object-fit:contain; border:2px solid var(--gold); border-radius:6px;
  box-shadow:0 0 0 1px var(--vin), 0 10px 40px rgba(0,0,0,.7); }
.zoom .zoom-legende{ color:var(--parchemin); font-size:max(2.2vh,15px); font-weight:600; letter-spacing:.06em; }
.zoom .zoom-x{ position:absolute; top:1.6vh; right:1.6vw; width:42px; height:42px; border-radius:50%; cursor:pointer;
  border:1px solid var(--gold); background:rgba(107,23,23,.9); color:var(--parchemin); font-size:20px; line-height:1; }
.zoom .zoom-nav{ position:absolute; top:50%; transform:translateY(-50%); width:48px; height:72px; border:none; cursor:pointer;
  background:transparent; color:var(--gold-clair); font-size:38px; opacity:.6; }
.zoom .zoom-nav:hover{ opacity:1; }
.zoom .zoom-nav[disabled]{ opacity:.15; cursor:default; }
.zoom .zoom-prev{ left:.6vw; } .zoom .zoom-next{ right:.6vw; }

/* Barre de défilement discrète (les textes restent dans la zone du parchemin) */
.texte,.liste{ scrollbar-width:thin; scrollbar-color:rgba(184,137,43,.7) transparent; }

/* ── Bouton « Échec-et-Math » (table des matières uniquement) ── */
.echecs-btn{
  all:unset; box-sizing:border-box; cursor:pointer; align-self:center;
  display:flex; align-items:center; gap:1cqw;
  margin:.2cqw auto 1.3cqw; padding:.55cqw 1.9cqw .55cqw 1cqw;
  border-radius:999px; border:2px solid #8a6a1f;
  background:linear-gradient(160deg, #ffe38a, #d9a625);
  box-shadow:0 .3cqw .8cqw -.3cqw rgba(43,26,12,.55);
  transition:transform .15s, box-shadow .15s;
}
.echecs-btn:hover,.echecs-btn:focus-visible{ transform:translateY(-.15cqw); box-shadow:0 .5cqw 1.1cqw -.4cqw rgba(43,26,12,.65); }
.echecs-btn:focus-visible{ outline:2px solid var(--vin); outline-offset:2px; }
.echecs-btn img{ width:3.6cqw; height:3.6cqw; object-fit:contain; filter:drop-shadow(0 .2cqw .25cqw rgba(0,0,0,.5)); }
.echecs-btn span{ font-family:'Cinzel Decorative','EB Garamond',serif; font-weight:700; letter-spacing:.03em;
  font-size:max(1.55cqw,13px); color:#2b1a0c; }

/* ── Bouton bleu « Cherche et trouve » (en tête de chaque chapitre) ── */
.cherche-btn{
  all:unset; box-sizing:border-box; cursor:pointer; align-self:center;
  display:flex; align-items:center; gap:1cqw;
  margin:.2cqw auto 1.3cqw; padding:.55cqw 1.9cqw .55cqw 1.1cqw;
  border-radius:999px; border:2px solid #1d4f86;
  background:linear-gradient(160deg, #9fd3ff, #2f7fd1);
  box-shadow:0 .3cqw .8cqw -.3cqw rgba(12,26,43,.55);
  transition:transform .15s, box-shadow .15s;
}
.cherche-btn:hover,.cherche-btn:focus-visible{ transform:translateY(-.15cqw); box-shadow:0 .5cqw 1.1cqw -.4cqw rgba(12,26,43,.65); }
.cherche-btn:focus-visible{ outline:2px solid var(--vin); outline-offset:2px; }
.cherche-btn svg{ width:3cqw; height:3cqw; flex:none; filter:drop-shadow(0 .15cqw .2cqw rgba(0,0,0,.4)); }
.cherche-btn span{ font-family:'Cinzel Decorative','EB Garamond',serif; font-weight:700; letter-spacing:.03em;
  font-size:max(1.55cqw,13px); color:#fff; text-shadow:0 1px 2px rgba(10,30,60,.6); }
.vide{ text-align:center; font-style:italic; color:var(--ink-soft); font-size:max(1.8cqw,13px); margin-top:2cqw; }
/* vignette détourée (fond transparent) : l'image entière, sans cadre */
.entree .vignette.detouree{ object-fit:contain; border:none; border-radius:0; transform:scale(1.3); filter:drop-shadow(0 .2cqw .3cqw rgba(43,26,12,.45)); }

/* ── Jeu d'échecs et documents (superposition plein écran) ── */
.echecs-modal{ position:fixed; inset:0; z-index:80; display:none; flex-direction:column; background:#140a05; }
.echecs-modal.open{ display:flex; }
.echecs-modal-bar{ flex:none; display:flex; justify-content:flex-end; padding:10px 16px;
  background:#1c130a; border-bottom:1px solid rgba(184,137,43,.5); }
.echecs-modal-close{ all:unset; cursor:pointer; padding:8px 18px; border:1px solid var(--gold); border-radius:999px;
  color:var(--gold-clair); font:600 14px/1 'EB Garamond',serif; letter-spacing:.03em; }
.echecs-modal-close:hover,.echecs-modal-close:focus-visible{ background:rgba(184,137,43,.2); }
.echecs-modal-close:focus-visible{ outline:2px solid var(--gold-clair); outline-offset:2px; }
.echecs-modal-frame{ flex:1; width:100%; border:none; display:block; }

/* ── Petits écrans (téléphone portrait) : une seule colonne, défilement interne ── */
@media (max-width:700px){
  #app{ left:16%; right:16%; top:31%; bottom:16%; }
  .page{ overflow-y:auto; align-items:start; display:flex; flex-direction:column; gap:2cqw; }
  .page--cote,.page--portrait,.page--texte,.page--solo{ display:flex; }
  .fig{ height:auto; }
  .fig img{ max-height:none; }
  .titre-livre{ font-size:max(3.3cqw,13px); }
  .sous-titre,.chemin,.retour,.compteur,.legende,.pastille,.btn,.entree .meta,.echecs-btn span,.cherche-btn span{ font-size:max(1.3cqw,8.5px); }
  .texte p{ font-size:max(1.9cqw,10.5px); }
  .page--texte .texte p{ font-size:max(1.95cqw,10.5px); }
  .entree .nom{ font-size:max(2.1cqw,11px); }
  .entree .vignette{ display:none; }
  .compteur{ display:none; }
}

/* ── Exercice « Cherche et trouve » : plein écran (les objets à trouver sont petits) ── */
.entree .pastille-etat{ flex:none; font-size:max(1.3cqw,11px); font-weight:700; padding:.3cqw 1cqw; border:1px solid var(--gold);
  border-radius:999px; color:var(--ink-soft); background:rgba(255,248,228,.7); letter-spacing:.05em; }
.entree .pastille-etat.ok{ background:var(--vin); color:var(--parchemin); }
.jeu{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; background:#120a05; color:var(--parchemin);
  animation:fondu .2s ease-out; }
.jeu-haut{ flex:none; display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid rgba(184,137,43,.5); }
.jeu-titre{ font-family:'Cinzel Decorative','EB Garamond',serif; font-weight:700; font-size:clamp(16px,2.4vh,24px); color:var(--gold-clair); }
.jeu-compteur{ font:600 14px/1 'EB Garamond',serif; padding:5px 11px; border:1px solid var(--gold); border-radius:999px; color:var(--parchemin); letter-spacing:.08em; }
.jeu-compteur.ok{ background:var(--vin); }
.jeu-bravo{ font-weight:700; color:var(--gold-clair); letter-spacing:.06em; animation:fondu .4s ease-out; }
.jeu-espace{ flex:1; }
.jeu-btn{ all:unset; cursor:pointer; padding:5px 14px; border:1px solid var(--gold); border-radius:999px; font:600 14px/1.2 'EB Garamond',serif; color:var(--parchemin); }
.jeu-btn:hover:not([disabled]){ background:rgba(184,137,43,.25); }
.jeu-btn[disabled]{ opacity:.3; cursor:default; }
.jeu-btn:focus-visible{ outline:2px solid var(--gold-clair); outline-offset:2px; }
.jeu-x{ width:36px; height:36px; border-radius:50%; cursor:pointer; border:1px solid var(--gold); background:rgba(107,23,23,.9); color:var(--parchemin); font-size:16px; line-height:1; }
.jeu-plateau{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px; }
.jeu-zone{ position:relative; line-height:0; cursor:crosshair; user-select:none; border:2px solid var(--gold); border-radius:6px;
  box-shadow:0 0 0 1px var(--vin), 0 10px 40px rgba(0,0,0,.7); }
.jeu-zone img{ width:100%; height:100%; display:block; pointer-events:none; border-radius:4px; }
.jeu-zone.secoue{ animation:secoue .28s ease; }
@keyframes secoue{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-5px); } 40%{ transform:translateX(5px); } 60%{ transform:translateX(-3px); } 80%{ transform:translateX(3px); } }
.cercle{ position:absolute; width:var(--d,70px); height:var(--d,70px); transform:translate(-50%,-50%); border-radius:50%;
  border:3px solid #ff2a2a; background:rgba(255,42,42,.12); pointer-events:none; box-shadow:0 0 0 2px #fff, 0 2px 8px rgba(0,0,0,.3); }
.cercle.nouveau{ animation:pop .35s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop{ 0%{ transform:translate(-50%,-50%) scale(0); opacity:0; } 60%{ transform:translate(-50%,-50%) scale(1.15); opacity:1; } 100%{ transform:translate(-50%,-50%) scale(1); opacity:1; } }
.jeu-bas{ flex:none; display:flex; align-items:center; gap:14px; padding:8px 16px 12px; border-top:1px solid rgba(184,137,43,.5); flex-wrap:wrap; }
.jeu-consigne{ font:600 15px/1.2 'EB Garamond',serif; color:var(--gold-clair); letter-spacing:.04em; }
.jeu-items{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px 18px; }
.jeu-items li{ font:500 clamp(14px,2vh,18px)/1.3 'EB Garamond',Georgia,serif; display:flex; align-items:center; gap:7px; }
.jeu-items li::before{ content:""; width:7px; height:7px; border-radius:50%; background:rgba(243,229,196,.35); flex:none; }
.jeu-items li.trouve{ text-decoration:line-through; color:rgba(243,229,196,.45); }
.jeu-items li.trouve::before{ background:var(--gold-clair); }
.jeu-items.nombreux{ flex:1; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:3px 16px; counter-reset:obj; }
.jeu-items.nombreux li{ font-size:clamp(12.5px,1.6vh,16px); line-height:1.2; }
.jeu-items.nombreux li::before{ counter-increment:obj; content:counter(obj); width:auto; height:auto; min-width:1.5em; border-radius:0;
  background:none; color:rgba(243,229,196,.55); font-weight:700; font-size:.85em; text-align:right; }
.jeu-items.nombreux li.trouve::before{ background:none; color:var(--gold-clair); }
/* ── Compagnon de lecture (minuterie de 5 min) et XP ── */
.lect-compagnon{ position:fixed; right:10px; bottom:8px; z-index:95; display:flex; flex-direction:column; align-items:flex-end; gap:6px; pointer-events:none;
  opacity:0; transform:translateY(24px); transition:opacity .35s, transform .35s cubic-bezier(.2,1.3,.4,1); font-family:'EB Garamond', Georgia, serif; }
.lect-compagnon.visible{ opacity:1; transform:none; }
.lect-compagnon img{ height:min(150px, 20vh); width:auto; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); order:2; }
.lect-bulle{ pointer-events:auto; order:1; margin-bottom:0; width:226px; padding:10px 13px; background:#f4e9cf; color:#2b1d0e;
  border:2px solid #8b6914; border-radius:14px; font-size:16px; line-height:1.3; box-shadow:0 6px 16px rgba(0,0,0,.45); position:relative; }
.lect-bulle::after{ content:""; position:absolute; right:40px; bottom:-10px; border:8px solid transparent; border-top-color:#8b6914; border-bottom:0; }
.lect-nom{ display:block; font-family:'Cinzel Decorative', Georgia, serif; font-size:11px; font-weight:700; letter-spacing:1px; color:#7a1f1f; margin-bottom:2px; }
.lect-temps{ display:flex; align-items:center; gap:8px; margin:4px 0 2px; font-weight:700; }
.lect-temps .sablier{ font-size:20px; }
.lect-temps .chiffres{ font-size:22px; font-variant-numeric:tabular-nums; color:#6b1717; }
.lect-barre{ height:6px; border-radius:99px; background:rgba(0,0,0,.12); overflow:hidden; margin:4px 0; }
.lect-barre i{ display:block; height:100%; background:linear-gradient(90deg, #e2c06a, #b8892b); transition:width .9s linear; }
.lect-vues{ font-size:14px; color:#5b4126; }
.lect-choix{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.lect-choix button{ font:700 15px 'EB Garamond', Georgia, serif; text-align:left; cursor:pointer; padding:6px 10px; border-radius:9px; border:2px solid #8b6914; background:#fffaf0; color:#2b1d0e; }
.lect-choix button.reste{ background:#6b1717; color:#fff; border-color:#6b1717; }
.xp-pastille{ flex:none; font:700 12px 'EB Garamond', Georgia, serif; padding:2px 8px; border-radius:999px; background:rgba(184,137,43,.18); color:#6b4a10; border:1px solid #b8892b; white-space:nowrap; margin-left:6px; }
.xp-pastille.gagne{ background:#2f5d3a; color:#fff; border-color:#2f5d3a; }
.xp-toast{ position:fixed; left:50%; top:14%; transform:translate(-50%, -10px); z-index:96; opacity:0; pointer-events:none; transition:opacity .3s, transform .3s;
  background:linear-gradient(180deg, #2b1a0c, #140a05); color:#fde68a; border:2px solid #e2c06a; border-radius:14px; padding:10px 20px; text-align:center;
  font:700 20px 'Cinzel Decorative', Georgia, serif; box-shadow:0 8px 24px rgba(0,0,0,.6), 0 0 24px rgba(226,192,106,.35); }
.xp-toast small{ display:block; font:600 15px 'EB Garamond', Georgia, serif; color:#f3e5c4; margin-top:2px; }
.xp-toast.visible{ opacity:1; transform:translate(-50%, 0); }
/* ── La scène magique (27 sept. 2026) ──
   La fiche envoie la place prise par la boule de cristal (gauche) et par le compagnon (droite) :
   le livre se tasse entre les deux, en douceur. Quand le compagnon de la fiche monte sur scène
   (menu), le compagnon de lecture d'ici lui cède la place : c'est le même compagnon. */
:root{ --rg:0px; --rd:0px; }
body{ padding-left:var(--rg); padding-right:var(--rd); transition:padding .6s cubic-bezier(.3,.85,.25,1); }
.parchemin-conteneur{ width:min(calc(90vw - var(--rg) - var(--rd)), calc(97vh * 1.1807), 1568px); transition:width .6s cubic-bezier(.3,.85,.25,1); }
body.compagnon-menu .lect-compagnon.visible{ opacity:0; transform:translateX(30px); pointer-events:none; }
body.compagnon-menu .lect-compagnon.visible .lect-bulle{ pointer-events:none; }
</style>

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unite  = p => p.unite || ['Page','pages'];
const romain = n => ['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n] || String(n);
const hashDe = ch => '#/' + ch.slice(1).map(x => x.id).join('/');

function metaDe(c, profondeurEnfant){
  if(c.meta) return c.meta;
  if(c.enfants) return plur(c.enfants.length, profondeurEnfant === 1 ? 'section' : 'sous-section', profondeurEnfant === 1 ? 'sections' : 'sous-sections');
  const g = c.genre ? c.genre + ' · ' : '';
  if(c.type === 'cherche') return g + plur(c.defis.length, 'scène', 'scènes');
  return g + `${c.pages.length} ${unite(c)[1]}`;
}

/* ── Agrandissement plein écran d'une image (les affiches contiennent du texte) ── */
let courant = null;   // {chemin, n} quand on est dans le lecteur

/* ── Vidéo muette en plein écran : joue une fois puis disparaît (l'élève reclique ▶ pour la revoir) ── */
let videoEl = null;
function fermerVideo(){ if(videoEl){ const v = videoEl.querySelector('video'); if(v){ v.pause(); v.removeAttribute('src'); v.load(); } videoEl.remove(); videoEl = null; } }
function ouvrirVideo(src){

  document.body.appendChild(videoEl);
  const pr = v.play(); if(pr && pr.catch) pr.catch(() => {});
}

/* ── Exercice Cherche et trouve (plein écran) ── */
let jeuEl = null, jeuNode = null, jeuId = null, pauseJeu = 0;
// Plein écran : c'est toute la FICHE qui passe en plein écran (et non le jeu seul), pour que le compagnon, la boule
// et la loupe restent là par-dessus. Le livre le demande à la fiche par message ; ouvert seul, il le fait lui-même.
function pleinEcran(oui){
  if(window.parent !== window){ try{ window.parent.postMessage({ type: 'lm-plein-ecran', actif: !!oui, lmAgent: true }, '*'); }catch(e){} return; }
  try{
    if(oui && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    if(!oui && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }catch(e){}
}
function fermerJeu(rafraichir){ if(jeuEl){ pleinEcran(false); jeuEl.remove(); jeuEl = null; jeuNode = null; jeuId = null; if(rafraichir) rendu(); } }
function ouvrirJeu(node, id){
  fermerZoom(); jeuNode = node; jeuId = id;
  if(!jeuEl){
    jeuEl = document.createElement('div'); jeuEl.className = 'jeu'; document.body.appendChild(jeuEl);
    // vrai plein écran (le clic de l'élève l'autorise); sans effet si le navigateur le refuse
    pleinEcran(true);
  }
  rendreJeu();
}
function rendreJeu(nouveau){
  const defis = jeuNode.defis, i = defis.findIndex(d => d.id === jeuId), d = defis[i];
  const f = trouves(d), t = d.items.length, fini = f.length === t;
  jeuEl.innerHTML = `
    <div class="jeu-haut">
      <div class="jeu-titre">${esc(d.titre)}</div>
      <span class="jeu-compteur ${fini?'ok':''}">${f.length}/${t}</span>${fini ? `<span class="jeu-bravo">Bravo ${t}/${t} !</span>` : ''}
      <div class="jeu-espace"></div>
      <button class="jeu-btn" data-jeu-nav="-1" ${i===0?'disabled':''}>‹ Précédent</button>
      <button class="jeu-btn" data-jeu-nav="1" ${i===defis.length-1?'disabled':''}>Suivant ›</button>
      <button class="jeu-x" aria-label="Fermer">✕</button>
    </div>
    <div class="jeu-plateau">
      <div class="jeu-zone" id="jeuZone">
        <img src="${esc(d.img)}" alt="${esc(d.titre)}" draggable="false" onload="this.parentNode.dataset.ratio = this.naturalWidth / this.naturalHeight; ajusterJeu()">
        ${f.map(k => { const p = (posTrouvees[d.id] || {})[k] || positionsDe(d.zones[k])[0];
          const taille = p.r ? `;--d:max(26px,${p.r*2}cqw)` : '';
          return `<div class="cercle ${k===nouveau?'nouveau':''}" style="left:${p.x}%;top:${p.y}%${taille}"></div>`; }).join('')}
      </div>
    </div>
    <div class="jeu-bas">
      <span class="jeu-consigne">Clique sur l'image pour trouver :</span>
      <ul class="jeu-items ${t > 6 ? 'nombreux' : ''}">${d.items.map((x,k) => `<li class="${f.includes(k)?'trouve':''}">${esc(x)}</li>`).join('')}</ul>
    </div>`;
  ajusterJeu();
}
function ajusterJeu(){
  if(!jeuEl) return;
  const pl = jeuEl.querySelector('.jeu-plateau'), z = jeuEl.querySelector('#jeuZone'); if(!pl || !z) return;
  const r = parseFloat(z.dataset.ratio) || 1.5;
  const W = pl.clientWidth - 20, H = pl.clientHeight - 20;
  const w = Math.max(200, Math.min(W, H * r));
  z.style.width = w + 'px'; z.style.height = (w / r) + 'px';
  z.style.setProperty('--d', Math.max(40, w * 0.075) + 'px');
  z.style.containerType = 'inline-size';                 // cqw = % de la largeur de l'image (taille des cercles)
}
function clicJeu(e){
  const z = jeuEl.querySelector('#jeuZone'), d = jeuNode.defis.find(x => x.id === jeuId), f = trouves(d);
  if(f.length >= d.items.length || Date.now() < pauseJeu) return;
  const r = z.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
  let meilleur = -1, dist = Infinity, pos = null;
  d.zones.forEach((zn, k) => { if(f.includes(k)) return;
    positionsDe(zn).forEach(p => {
      // zone avec rayon r : distance ronde en % de la largeur; sinon ancienne mesure (tolérance commune)
      const dd = p.r ? Math.hypot(p.x - x, (p.y - y) * r.height / r.width) / p.r * TOLERANCE : Math.hypot(p.x - x, p.y - y);
      if(dd < dist){ dist = dd; meilleur = k; pos = p; } }); });
  if(meilleur !== -1 && dist <= TOLERANCE){
    f.push(meilleur); (posTrouvees[d.id] || (posTrouvees[d.id] = {}))[meilleur] = pos; rendreJeu(meilleur);
    sauverProgression();
    if(f.length === d.items.length) donnerXp('cherche:' + d.id, XP_CHERCHE, 'Cherche et trouve — ' + d.titre.replace(/^\d+\.\s*/, '')); }
  else { pauseJeu = Date.now() + 700;                     // clic raté : courte pause (décourage les clics au hasard)
         z.classList.add('secoue'); setTimeout(() => z.classList.remove('secoue'), 300); }
}
function changerJeu(dir){
  const defis = jeuNode.defis, i = defis.findIndex(d => d.id === jeuId) + dir;
  if(i >= 0 && i < defis.length){ jeuId = defis[i].id; rendreJeu(); }
}
window.addEventListener('resize', ajusterJeu);
document.addEventListener('fullscreenchange', ajusterJeu);

/* ═══════════════════════════════════════════════════════════════
   EXPÉRIENCE (XP) DU LIVRE D'HISTOIRE
     • Lecture (sous-section à pages, livret, coupure) : 100 XP, à deux conditions, sans échappatoire :
         1) 5 minutes de lecture sans quitter (minuterie du compagnon) ;
         2) l'histoire vue au complet (toutes les pages / le document lu jusqu'en bas).
       Partir avant la fin (retour, autre section, fermer le livre, changer d'onglet) : tout recommence.
       Le compagnon accompagne la lecture et demande à l'élève de rester s'il veut partir.
     • Questionnaire : 100 XP à 6 / 8 ou plus (une seule fois ; il peut recommencer).
     • Cherche et trouve : 50 XP par scène complétée.
   Progression : clé « histoire_<élève> » ; l'XP totale du livre va dans le coffre (coffre.xpHistoire, voir xp-core.js).
   Une lecture déjà récompensée se relit librement, sans minuterie.
   ═══════════════════════════════════════════════════════════════ */
const XP_LECTURE = 100, XP_QUESTIONNAIRE = 100, XP_CHERCHE = 50;
const DUREE_LECTURE = 5 * 60;                     // secondes
const identite = window.PasserelleCore ? window.PasserelleCore.lireIdentiteUrl() : null;
let progression = { gains: {}, trouves: {}, positions: {} };   // gains : { 'lecture:…' : XP }
const cleProgression = () => 'histoire_' + (identite ? identite.slug : 'atelier');
async function chargerProgression(){
  try{ const r = await window.storage.get(cleProgression(), true); if(r && r.value) progression = Object.assign(progression, JSON.parse(r.value)); }catch(e){}
  Object.assign(etat, progression.trouves || {});
  Object.assign(posTrouvees, progression.positions || {});
}
async function sauverProgression(){
  progression.trouves = etat; progression.positions = posTrouvees;
  try{ await window.storage.set(cleProgression(), JSON.stringify(progression), true); }catch(e){}
}
const xpGagne = cle => progression.gains[cle] || 0;
function toastXp(html){ const t = document.getElementById('xpToast'); t.innerHTML = html; t.classList.add('visible'); clearTimeout(toastXp.m); toastXp.m = setTimeout(() => t.classList.remove('visible'), 3800); }
// Donne l'XP une seule fois, et met à jour le coffre (total + rang).
async function donnerXp(cle, xp, titre){
  if(xpGagne(cle)) return false;
  progression.gains[cle] = xp;
  await sauverProgression();
  const totalLivre = Object.values(progression.gains).reduce((a, b) => a + b, 0);
  let monte = null;
  if(identite && window.PasserelleCore && window.XpCore){
    try{
      const res = await window.PasserelleCore.chargerCoffre(identite.slug, identite.nom);
      const r = window.XpCore.appliquer(res.donnees, 'xpHistoire', totalLivre);
      await window.PasserelleCore.sauvegarderCoffre(identite.slug, res.donnees);
      if(r.monte) monte = window.XpCore.NOMS[r.niveau];
      if(res.donnees.genre) genreEleve = res.donnees.genre;
    }catch(e){}
  }
  toastXp('✨ +' + xp + ' XP<small>' + esc(titre) + (monte ? ' — Tu es maintenant ' + esc(monte) + ' !' : '') + '</small>');
  return true;
}
function pastilleXp(cle, xp){
  const g = xpGagne(cle);
  return `<span class="xp-pastille${g ? ' gagne' : ''}">${g ? '✓ ' + g + ' XP' : '✨ ' + xp + ' XP'}</span>`;
}

/* ── Le compagnon de lecture ── */
let genreEleve = new URLSearchParams(location.search).get('genre');
const COMPAGNONS_LECTURE = { fille: ['Bébé Bahamut', 'compagnons/dragon.webp'], garcon: ['Geri', 'compagnons/chien-loup.webp'] };
const ENCOURAGEMENTS_LECTURE = [
  "Je lis avec toi. Prends ton temps !", "Regarde bien les images : elles racontent aussi l'histoire.",
  "Un vrai mage lit chaque mot.", "Imagine la scène dans ta tête…", "Tu avances bien, continue !",
  "Relis une phrase si elle est difficile.", "Les grands mages sont aussi de grands lecteurs."
];
function compagnon(contenuHtml){
  const c = COMPAGNONS_LECTURE[genreEleve] || COMPAGNONS_LECTURE.fille;
  const img = document.getElementById('lectImage');
  if(img.getAttribute('src') !== c[1]) img.setAttribute('src', c[1]);
  document.getElementById('lectNom').textContent = c[0];
  document.getElementById('lectContenu').innerHTML = contenuHtml;
  document.getElementById('lectCompagnon').classList.add('visible');
}
function cacherCompagnon(){ document.getElementById('lectCompagnon').classList.remove('visible'); }

/* ── La garde de lecture : minuterie + « vu au complet » ── */
window.GardeLecture = (function(){
  let actif = null;          // { cle, titre, restant, vues:Set, total, complet, prefixe, doc }
  let minuterie = null, question = false, phrase = 0, tic = 0;
  const mmss = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  function vuAuComplet(){ return actif && actif.total > 0 && actif.vues.size >= actif.total; }
  function afficher(){
    if(!actif || question) return;
    const fini = actif.restant <= 0, vu = vuAuComplet();
    const vues = actif.doc === 'defiler' ? (vu ? '✓ Lu jusqu\'en bas' : '📜 Lis jusqu\'en bas du document')
      : (vu ? '✓ Toutes les pages vues' : '📖 Pages vues : ' + actif.vues.size + ' / ' + (actif.total || '?'));
    compagnon((fini ? '<b>Le temps est écoulé !</b> Il te reste à tout voir pour gagner ton XP.' : esc(ENCOURAGEMENTS_LECTURE[phrase])) +
      '<div class="lect-temps"><span class="sablier">⏳</span><span class="chiffres">' + mmss(Math.max(0, actif.restant)) + '</span></div>' +
      '<div class="lect-barre"><i style="width:' + (100 * (DUREE_LECTURE - Math.max(0, actif.restant)) / DUREE_LECTURE) + '%"></i></div>' +
      '<div class="lect-vues">' + vues + '</div>');
  }
  async function verifierFin(){
    if(!actif || actif.restant > 0 || !vuAuComplet()) return;
    const a = actif; arreter();
    await donnerXp(a.cle, XP_LECTURE, a.titre);
    compagnon('🎉 <b>Bravo, lecture terminée !</b><br>Tu as gagné <b>' + XP_LECTURE + ' XP</b>.');
    setTimeout(() => { if(!actif) cacherCompagnon(); }, 5000);
    if(courant) rendu(); else if(!document.getElementById('docModal').classList.contains('open')) rendu();
  }
  function arreter(){ clearInterval(minuterie); minuterie = null; actif = null; question = false; }
  function commencer(o){
    if(xpGagne(o.cle)) return;                         // déjà récompensée : lecture libre
    if(actif && actif.cle === o.cle) return;
    arreter();
    actif = { cle: o.cle, titre: o.titre, restant: DUREE_LECTURE, vues: new Set(), total: o.total || 0, prefixe: o.prefixe || null, doc: o.doc || null };
    phrase = Math.floor(Math.random() * ENCOURAGEMENTS_LECTURE.length); tic = 0;
    minuterie = setInterval(() => {
      if(!actif) return;
      if(actif.restant > 0) actif.restant--;
      if(++tic % 40 === 0) phrase = (phrase + 1) % ENCOURAGEMENTS_LECTURE.length;
      if(actif.doc) inspecterDocument();
      afficher(); verifierFin();
    }, 1000);
    afficher();
  }
  function vue(cle, n, total){ if(actif && actif.cle === cle){ actif.vues.add(n); if(total) actif.total = total; afficher(); verifierFin(); } }
  function enCours(){ return !!actif; }
  // L'élève veut partir : le compagnon lui demande de rester. S'il part, la lecture recommencera.
  function demanderSortie(partir){
    if(!actif){ partir(); return; }
    question = true;
    compagnon('<b>Attends !</b> Il te reste encore <b>' + (actif.restant > 0 ? mmss(actif.restant) + ' de lecture' : 'des pages à voir') + '</b>. ' +
      'Si tu pars maintenant, tu devras <b>tout recommencer</b> pour gagner ton XP.' +
      '<div class="lect-choix"><button type="button" class="reste" id="lectReste">📖 Je reste et je continue</button>' +
      '<button type="button" id="lectPars">Je pars quand même</button></div>');
    document.getElementById('lectReste').onclick = () => { question = false; afficher(); };
    document.getElementById('lectPars').onclick = () => {
      const a = actif; arreter(); cacherCompagnon(); partir();
      // (ex. livre fermé depuis la fiche) : s'il est resté dans les pages abandonnées, retour à la liste — la lecture recommencera.
      if(a && a.prefixe && courant && hashDe(courant.chemin) === a.prefixe){ location.hash = hashDe(courant.chemin.slice(0, -1)); dernierHash = null; route(); }
      if(a && a.doc && document.getElementById('docModal').classList.contains('open')) fermerDoc();
    };
  }
  // Quitter l'écran (autre onglet, autre fenêtre) : la lecture recommence.
  document.addEventListener('visibilitychange', () => {
    if(document.hidden && actif){
      const o = { cle: actif.cle, titre: actif.titre, total: actif.total, prefixe: actif.prefixe, doc: actif.doc };
      arreter();
      commencer(o);
      if(courant && !o.doc) vue(o.cle, courant.n, o.total);
      question = true;
      compagnon('😟 <b>Tu as quitté ta lecture…</b> Je t\'avais demandé de rester ! Ta lecture <b>recommence depuis le début</b>.' +
        '<div class="lect-choix"><button type="button" class="reste" id="lectOk">D\'accord, je reste cette fois</button></div>');
      document.getElementById('lectOk').onclick = () => { question = false; afficher(); };
    }
  });
  // Documents (livret, coupure) : on regarde dedans où en est l'élève.
  function inspecterDocument(){
    const f = document.getElementById('docFrame');
    let d; try{ d = f.contentDocument; }catch(e){ return; }
    if(!d || !d.body) return;
    if(actif.doc === 'pages'){
      const m = (d.body.innerText || '').match(/—\s*(\d+)\s*\/\s*(\d+)\s*—/);
      if(m){ actif.total = +m[2]; actif.vues.add(+m[1]); }
    } else if(actif.doc === 'defiler'){
      actif.total = 1;
      const el = d.scrollingElement || d.documentElement, w = f.contentWindow;
      if(el && w && el.scrollTop + w.innerHeight >= el.scrollHeight - 40) actif.vues.add(1);
    }
  }
  return { commencer, vue, enCours, demanderSortie, arreter, dansLecture: h => !!(actif && actif.prefixe && (h === actif.prefixe || h.indexOf(actif.prefixe + '/') === 0)), actif: () => actif };
})();

/* ── Questionnaires : 100 XP à 6 / 8 ou plus ── */
let quizActif = null, quizMinuterie = null;
function surveillerQuestionnaire(cle, cfg, titre){
  clearInterval(quizMinuterie); quizActif = { cle, cfg, titre };
  quizMinuterie = setInterval(() => {
    const f = document.getElementById('docFrame');
    let d; try{ d = f.contentDocument; }catch(e){ return; }
    if(!d || !d.body || xpGagne(cle)) return;
    const t = d.body.innerText || '';
    const m = t.match(new RegExp('(\\d+)\\s*\\/\\s*' + cfg.sur + '(?!\\d)'));
    if(m && /score|bravo/i.test(t)){
      const note = +m[1];
      if(note >= cfg.min) donnerXp(cle, XP_QUESTIONNAIRE, titre + ' — ' + note + ' / ' + cfg.sur);
      else if(quizActif && quizActif.dernier !== note){ quizActif.dernier = note; toastXp('📜 ' + note + ' / ' + cfg.sur + '<small>Il faut ' + cfg.min + ' / ' + cfg.sur + ' pour gagner ' + XP_QUESTIONNAIRE + ' XP. Relis et recommence !</small>'); }
    }
  }, 800);
}

/* ── Documents (récits, coupures, questionnaires) : superposition plein écran ── */
function ouvrirDoc(src, titre, cle){
  const frame = document.getElementById('docFrame');
  frame.setAttribute('title', titre || 'Document');
  frame.setAttribute('src', src);
  document.getElementById('docModal').classList.add('open');
  const item = cle ? itemDocument(cle) : null;
  if(item && item.lecture) GardeLecture.commencer({ cle: 'lecture:' + cle, titre: item.titre, doc: item.lecture });
  if(item && item.questionnaire) surveillerQuestionnaire('quiz:' + cle, item.questionnaire, item.titre);
}
// Retrouve un document par sa clé « section/document » (ex. legende-toutankhamon/livret).
function itemDocument(cle){
  const [sid, did] = cle.split('/');
  const cherche = n => { if(!n || !n.enfants) return null; for(const c of n.enfants){ if(c.id === sid && c.enfants){ const d = c.enfants.find(x => x.id === did); if(d) return d; } const r = cherche(c); if(r) return r; } return null; };
  return cherche(LIVRE);
}
function demanderFermerDoc(){ if(GardeLecture.enCours()) GardeLecture.demanderSortie(fermerDoc); else fermerDoc(); }
function fermerDoc(){
  clearInterval(quizMinuterie); quizActif = null;
  GardeLecture.arreter(); cacherCompagnon();
  document.getElementById('docModal').classList.remove('open');
  document.getElementById('docFrame').setAttribute('src', 'about:blank');   // libère la mémoire (les livrets contiennent de grosses images)
}
document.getElementById('docCloseBtn').addEventListener('click', demanderFermerDoc);

/* ── Navigation ── */
let dernierHash = null;
function aller(hash){
  // Quitter une lecture en cours (hors de ses pages) : le compagnon demande de rester.
  if(GardeLecture.enCours() && GardeLecture.actif().prefixe && !GardeLecture.dansLecture(hash)){
    GardeLecture.demanderSortie(() => { location.hash = hash; route(); });
    return;
  }
  location.hash = hash; route();
}   // route() tout de suite : évite tout décalage si on appuie vite
function route(){
  fermerVideo();
  if(location.hash === dernierHash) return;                // déjà affiché (évite le double rendu avec hashchange)
  // Bouton « précédent » du navigateur pendant une lecture : on revient et le compagnon demande de rester.
  if(GardeLecture.enCours() && GardeLecture.actif().prefixe && !GardeLecture.dansLecture(location.hash)){
    const voulu = location.hash;
    history.replaceState(null, '', dernierHash);
    GardeLecture.demanderSortie(() => { location.hash = voulu; route(); });
    return;
  }
  dernierHash = location.hash;
  fermerJeu(false);
  rendu();
  majZoom();                                                // ferme l'agrandissement si la nouvelle vue n'a pas d'image
}
function enfantDe(node, id){
  const c = node.enfants && node.enfants.find(x => x.id === id);
  if(c) return c;
  if(node.jeux && id === JEUX_ID)
    return node._jeux || (node._jeux = { id: JEUX_ID, titre: 'Cherche et trouve', sous: node.titre, enfants: node.jeux });
  return null;
}
function rendu(){
  const segs = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
  let chemin = [LIVRE], i = 0;
  while(chemin[chemin.length-1].enfants && i < segs.length){
    const c = enfantDe(chemin[chemin.length-1], segs[i]);
    if(!c) break;
    chemin.push(c); i++;
  }
  const node = chemin[chemin.length-1];
  courant = null;
  if(GardeLecture.enCours() && GardeLecture.actif().prefixe && !GardeLecture.dansLecture(location.hash || '#/')){ GardeLecture.arreter(); cacherCompagnon(); }
  if(node.enfants){ vueListe(chemin); return; }
  if(node.type === 'cherche'){ vueCherche(chemin); return; }
  let n = parseInt(segs[i], 10); if(!(n >= 1)) n = 1; if(n > node.pages.length) n = node.pages.length;
  courant = {chemin, n};
  vueLecteur(chemin, n);
  // Lecture à pages : minuterie de 5 min + toutes les pages vues.
  const cleLecture = 'lecture:' + hashDe(chemin);
  GardeLecture.commencer({ cle: cleLecture, titre: node.titre, total: node.pages.length, prefixe: hashDe(chemin) });
  GardeLecture.vue(cleLecture, n, node.pages.length);
}

document.addEventListener('click', e => {
  if(videoEl){ if(videoEl.contains(e.target)) fermerVideo(); return; }
  const pv = e.target.closest('[data-video]');
  if(pv){ ouvrirVideo(pv.dataset.video); return; }
  if(jeuEl){
    if(e.target.closest('#jeuZone')) clicJeu(e);
    else if(e.target.closest('.jeu-x')) fermerJeu(true);
    else { const nv = e.target.closest('[data-jeu-nav]'); if(nv && !nv.disabled) changerJeu(parseInt(nv.dataset.jeuNav, 10)); }
    return;
  }
  if(zoomEl && zoomEl.contains(e.target)){
    const nav = e.target.closest('.zoom-nav');
    if(nav){ e.stopPropagation(); if(!nav.disabled){ const {chemin, n} = courant; aller(`${hashDe(chemin)}/${n + parseInt(nav.dataset.dir,10)}`); } }
    else fermerZoom();
    return;
  }
  const dc = e.target.closest('[data-doc]');
  if(dc){ ouvrirDoc(dc.dataset.doc, dc.dataset.titre, dc.dataset.cle); return; }
  const j = e.target.closest('[data-jeu]');
  if(j){ const chemin = enCours(); ouvrirJeu(chemin[chemin.length-1], j.dataset.jeu); return; }
  if(e.target.closest('[data-zoom]') || e.target.closest('.fig img')){ ouvrirZoom(); return; }
  const b = e.target.closest('[data-go]');
  if(!b || b.disabled) return;
  aller(b.getAttribute('data-go'));
});
function enCours(){   // chemin de la vue affichée (utile pour l'exercice)
  const segs = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
  let chemin = [LIVRE];
  for(const s of segs){ const c = enfantDe(chemin[chemin.length-1], s); if(!c) break; chemin.push(c); }
  return chemin;
}
window.addEventListener('hashchange', route);
window.addEventListener('keydown', e => {
  if(videoEl){ if(e.key === 'Escape') fermerVideo(); return; }
  if(document.getElementById('docModal').classList.contains('open')){
    if(e.key === 'Escape') demanderFermerDoc();
    return;
  }
  if(document.getElementById('echecsModal').classList.contains('open')){
    if(e.key === 'Escape') fermerEchecs();
    return;
  }
  if(jeuEl){
    if(e.key === 'Escape') fermerJeu(true);
    else if(e.key === 'ArrowRight') changerJeu(1);
    else if(e.key === 'ArrowLeft') changerJeu(-1);
    return;
  }
  if(e.key === 'Escape' && zoomEl){ fermerZoom(); return; }
  if(!courant) return;
  const {chemin, n} = courant, p = chemin[chemin.length-1], base = hashDe(chemin);
  if(e.key === 'ArrowRight' && n < p.pages.length) aller(`${base}/${n+1}`);
  else if(e.key === 'ArrowLeft' && n > 1) aller(`${base}/${n-1}`);
  else if(e.key === 'Escape') aller(hashDe(chemin.slice(0, -1)));
});
// Démarrage : la progression de l'élève (XP, objets trouvés) d'abord, puis l'affichage.
(async function(){
  await chargerProgression();
  if(!genreEleve && identite && window.PasserelleCore){
    try{ const r = await window.PasserelleCore.chargerCoffre(identite.slug, identite.nom); genreEleve = r.donnees.genre || null; }catch(e){}
  }
  dernierHash = null;
  route();
})();

/* ── La scène magique : place prise par la boule (gauche) et le compagnon (droite), envoyée par la fiche ── */
(function(){
  window.addEventListener('message', e => {
    const d = e.data;
    if(!d || d.type !== 'scene-magique') return;
    document.documentElement.style.setProperty('--rg', Math.max(0, d.gauche | 0) + 'px');
    document.documentElement.style.setProperty('--rd', Math.max(0, d.droite | 0) + 'px');
    document.body.classList.toggle('compagnon-menu', d.compagnon === 'menu');
  });
  // En retour : la hauteur qu'occupe le compagnon de lecture en bas à droite (le narrateur se pose au-dessus).
  const lc = document.getElementById('lectCompagnon');
  if(!lc) return;
  let dernier = -1;
  const signaler = () => {
    const h = lc.classList.contains('visible') ? Math.round(window.innerHeight - lc.getBoundingClientRect().top) : 0;
    if(h !== dernier){ dernier = h; const m = { type: 'scene-occupe', basDroite: h };
      try{ if(window.parent !== window) window.parent.postMessage(m, '*'); window.postMessage(m, '*'); }catch(e){} }   // à soi aussi : livre ouvert seul (autonome)
  };
  new MutationObserver(() => setTimeout(signaler, 400)).observe(lc, { attributes: true, attributeFilter: ['class'], childList: true, subtree: true });
  window.addEventListener('resize', signaler);
  setInterval(signaler, 1500);
})();
</script>
