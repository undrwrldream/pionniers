<script>
/* Affichage sur le parchemin : quand le document est ouvert DANS le Grimoire (dans un cadre), on rend son fond transparent.
   C'est écrit ici, dans le document, pour que ça marche même quand le projet est ouvert depuis un dossier (file://). */
try{ if(window.self !== window.top) document.documentElement.classList.add('dans-grimoire'); }catch(e){ document.documentElement.classList.add('dans-grimoire'); }
</script>
<style id="grimoire-parchemin">
  html.dans-grimoire, html.dans-grimoire body{ background: transparent !important; }
  html.dans-grimoire #root > div{ background: transparent !important; min-height: 0 !important; }
  html.dans-grimoire #root header[class*="sticky"]{ display: none !important; }
  html.dans-grimoire #root main{ max-width: min(100%, 1180px) !important; background: rgba(255,250,236,0.62); border-radius: 18px; margin-top: 10px; margin-bottom: 10px; }
  html.dans-grimoire #root main > div:first-child{ padding-top: 28px !important; }
</style>
</head>
