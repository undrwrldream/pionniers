<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="config-classe.js"></script>
<script src="garde-classe.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recueil de nouvelles — Marc-André Deschênes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parch-1:#ecdfc0;
    --parch-2:#e2d0a8;
    --parch-3:#d8c294;
    --parch-edge:#c4a86d;
    --ink:#3a2a16;
    --ink-soft:#5a4527;
    --gold:#9c7a3c;
    --gold-bright:#c9a24b;
    --leather:#3c2415;
    --leather-2:#2a190e;
    --leather-hl:#5c3820;
    --shadow-deep: rgba(20,12,4,0.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 50% 0%, #4a2f1c 0%, #241409 70%, #150b04 100%);
    font-family:'EB Garamond', serif;
    color:var(--ink);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    perspective: 2400px;
    padding: 18px;
  }
  .stage::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 42%, rgba(255,214,140,0.10), transparent 55%);
    pointer-events:none;
  }

  .book-wrap{
    position:relative;
    width:min(96vw, 1080px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .book{
    position:relative;
    width:100%;
    aspect-ratio: 15 / 10;
    max-height: 72dvh;
    display:flex;
    border-radius:6px;
    box-shadow:
      0 30px 60px var(--shadow-deep),
      0 8px 22px rgba(0,0,0,0.45);
    background: linear-gradient(180deg, var(--leather-hl), var(--leather) 12%, var(--leather-2));
    padding: 14px;
    transform-style: preserve-3d;
    transition: transform .5s ease;
  }
  .book.turning{ transform: rotateY(-4deg) scale(0.992); }

  .spine{
    position:absolute;
    left:50%; top:8px; bottom:8px;
    width:26px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, rgba(0,0,0,0.55), rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.05) 70%, rgba(0,0,0,0.55));
    z-index:5;
    pointer-events:none;
  }

  .leaf{
    position:relative;
    flex:1 1 50%;
    min-width:0;
    background:
      radial-gradient(120% 140% at 8% 8%, rgba(255,255,255,0.10), transparent 45%),
      linear-gradient(135deg, var(--parch-1), var(--parch-2) 55%, var(--parch-3));
    border:1px solid #8a6a3a55;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .leaf.left{ border-radius:3px 0 0 3px; box-shadow: inset -10px 0 24px -14px rgba(60,40,15,0.55); }
  .leaf.right{ border-radius:0 3px 3px 0; box-shadow: inset 10px 0 24px -14px rgba(60,40,15,0.55); }

  .leaf::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(120,86,40,0.10) 0%, transparent 18%),
      radial-gradient(circle at 85% 75%, rgba(120,86,40,0.12) 0%, transparent 22%),
      radial-gradient(circle at 60% 15%, rgba(120,86,40,0.07) 0%, transparent 16%),
      repeating-linear-gradient(90deg, rgba(90,60,20,0.025) 0px, transparent 2px, transparent 4px);
    mix-blend-mode: multiply;
    pointer-events:none;
  }
  .leaf::after{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 60px 4px rgba(70,45,15,0.20);
    pointer-events:none;
  }

  .leaf-inner{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    padding: clamp(20px, 4.2%, 46px) clamp(18px, 4.6%, 42px);
    overflow:hidden;
  }

  .leaf-text{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    font-size: clamp(12px, 1.55vw, 16.5px);
    line-height:1.62;
    color:var(--ink);
    text-align:justify;
    hyphens:auto;
    scrollbar-width:thin;
    scrollbar-color: var(--gold-bright) transparent;
  }
  .leaf-text::-webkit-scrollbar{ width:5px; }
  .leaf-text::-webkit-scrollbar-thumb{ background:var(--gold-bright); border-radius:3px; opacity:0.5; }
  .leaf-text::-webkit-scrollbar-track{ background:transparent; }
  .leaf-text p{ margin:0 0 0.85em 0; text-indent:1.4em; }
  .leaf-text p:first-child{ text-indent:0; }
  .leaf-text p.no-indent{ text-indent:0; }
  .leaf-text .dropcap{
    float:left;
    font-family:'Cinzel Decorative', serif;
    font-size: 2.8em;
    line-height:0.78;
    padding:0.04em 0.09em 0 0;
    color: var(--gold);
    text-shadow: 1px 1px 0 rgba(60,40,10,0.25);
  }
  .leaf-text .dialogue{ text-indent:0; padding-left:0.6em; }

  .leaf-folio{
    text-align:center;
    font-family:'Cinzel Decorative', serif;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--ink-soft);
    margin-top:8px;
    opacity:0.8;
  }

  /* COVER (recueil et nouvelles) */
  .cover{
    overflow:visible;
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:
      radial-gradient(120% 140% at 50% 30%, rgba(255,255,255,0.08), transparent 50%),
      linear-gradient(150deg, #dfc99a, #cbaf78 55%, #b89760);
  }
  .cover-frame{
    border: 1.5px solid var(--gold);
    outline: 1px solid rgba(156,122,60,0.35);
    outline-offset: 6px;
    padding: clamp(14px,4%,34px) clamp(10px,4%,26px);
    display:flex; flex-direction:column; align-items:center; gap:14px;
    width:82%; height:84%;
    justify-content:center;
  }
  .cover h1{
    font-family:'Cinzel Decorative', serif;
    font-weight:700;
    font-size: clamp(16px, 2.5vw, 29px);
    line-height:1.25;
    margin:0;
    color: var(--leather);
    text-shadow: 0 1px 0 rgba(255,255,255,0.25);
  }
  .cover .byline{
    font-style:italic;
    font-size: clamp(11px, 1.3vw, 15px);
    color: var(--ink-soft);
  }
  .cover .collection{
    margin-top:8px;
    font-family:'Cinzel Decorative', serif;
    font-size: clamp(9px, 1vw, 11px);
    letter-spacing:0.18em;
    color: var(--gold);
    text-transform:uppercase;
  }
  .cover .ornament{ font-size: 20px; color: var(--gold); letter-spacing: 0.3em; opacity:0.85; }

  /* TABLE DES MATIÈRES */
  .toc-title{
    font-family:'Cinzel Decorative', serif;
    font-size: clamp(15px,1.8vw,20px);
    color: var(--leather);
    text-align:center;
    margin: 0 0 6px 0;
    letter-spacing:0.06em;
  }
  .toc-rule{ text-align:center; color:var(--gold); font-size:13px; margin-bottom:16px; opacity:0.8; }
  .toc-list{ list-style:none; margin:0; padding:0; }
  .toc-entry{
    display:flex; align-items:baseline; gap:8px;
    padding: 9px 4px;
    cursor:pointer;
    font-size: clamp(12px, 1.5vw, 15px);
    color: var(--ink);
    border-bottom: 1px dotted rgba(90,60,20,0.3);
    transition: color .15s ease;
  }
  .toc-entry:hover{ color: var(--gold-bright); }
  .toc-entry .toc-num{
    font-family:'Cinzel Decorative', serif;
    color: var(--gold);
    font-size:0.85em;
    min-width:1.4em;
  }
  .toc-entry .toc-name{ flex:1; }
  .toc-entry .toc-dots{ flex:1; border-bottom: 1px dotted rgba(90,60,20,0.35); margin:0 4px; }
  .toc-entry .toc-page{ font-style:italic; color:var(--ink-soft); font-size:0.9em; }
  .toc-empty{ text-align:center; font-style:italic; color:var(--ink-soft); margin-top:30px; font-size:13px; }

  /* FIN D'UNE NOUVELLE */
  .story-end{ align-items:center; justify-content:center; text-align:center; }
  .story-end .fin{
    font-family:'Cinzel Decorative', serif;
    font-size: clamp(18px,2.6vw,30px);
    color: var(--gold);
    letter-spacing:0.25em;
  }
  .story-end .sigil{ margin-top:16px; font-size:24px; color:var(--gold); opacity:0.75; }
  .story-end .meta{
    margin-top:16px;
    font-size: clamp(10px,1.1vw,13px);
    color: var(--ink-soft);
    font-style:italic;
    line-height:1.7;
  }

  .leaf.blank .leaf-inner{ align-items:center; justify-content:center; }
  .leaf.blank .sigil{ font-size:28px; color:var(--gold); opacity:0.35; }

  /* CADENAS — nouvelle verrouillée */
  .cover.locked{
    background:
      radial-gradient(120% 140% at 50% 30%, rgba(0,0,0,0.12), transparent 55%),
      linear-gradient(150deg, #b9a276, #9c8760 55%, #85714d);
  }

  /* COMPRÉHENSION DE LECTURE */
  .comprehension-intro .toc-title{ margin-bottom:4px; }
  .comprehension-intro .intro-text{ text-indent:0; font-size:0.95em; color:var(--ink-soft); margin-top:14px; }
  .comprehension-intro .intro-text + .intro-text{ margin-top:10px; }
  .question-page{ display:flex; flex-direction:column; }
  .question-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .question-num{
    font-family:'Cinzel Decorative', serif;
    color:var(--gold);
    font-size:0.85em;
    letter-spacing:0.08em;
    margin-bottom:6px;
  }
  .question-text{ text-indent:0 !important; margin-bottom:0 !important; }
  .gold-badge{
    flex:0 0 auto;
    display:flex; align-items:center; gap:4px;
    font-family:'Cinzel Decorative', serif;
    font-size:0.78em;
    color:#7a5a1e;
    background: linear-gradient(180deg, #f4dfa0, #d9b969);
    border:1px solid var(--gold);
    border-radius:3px;
    padding:4px 9px;
    white-space:nowrap;
  }
  .write-lines{ margin-top:22px; flex:1; }

  .submit-page{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center; padding-top:20px; }
  .submit-btn{
    margin-top:26px;
    font-family:'Cinzel Decorative', serif;
    font-size: clamp(11px, 1.3vw, 14px);
    letter-spacing:0.06em;
    color:#6b5327;
    background: linear-gradient(180deg, #e7d29a, #cdae6c);
    border:1.5px solid var(--gold);
    border-radius:4px;
    padding:12px 22px;
    cursor:not-allowed;
    opacity:0.75;
    box-shadow: 0 3px 0 rgba(90,65,20,0.25);
  }
  .write-line{
    border-bottom:1px dotted rgba(90,60,20,0.45);
    height: 2.6em;
  }

  /* NAV */
  .controls{
    display:flex; align-items:center; gap:14px;
    color: var(--parch-1);
    font-family:'Cinzel Decorative', serif;
    font-size:12px;
    letter-spacing:0.08em;
    user-select:none;
    flex-wrap:wrap;
    justify-content:center;
  }
  .nav-btn{
    appearance:none; border:1px solid var(--gold);
    background: linear-gradient(180deg, #5c3820, #3c2415);
    color: var(--parch-1);
    font-family:'Cinzel Decorative', serif;
    font-size: 12px;
    letter-spacing:0.08em;
    padding:9px 18px;
    border-radius:3px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 6px 14px rgba(0,0,0,0.3);
  }
  .nav-btn:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 8px 18px rgba(0,0,0,0.35); }
  .nav-btn:active:not(:disabled){ transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }
  .nav-btn.toc-btn{ background: linear-gradient(180deg, #7a5a2e, #543c18); }
  .folio-indicator{ min-width:100px; text-align:center; color:#e7d6ab; opacity:0.9; }

  @media (max-width: 640px){
    .book{ aspect-ratio: 10 / 13; flex-direction:column; max-height:78dvh; }
    .spine{ left:8px; right:8px; top:50%; bottom:auto; height:20px; width:auto; transform:translateY(-50%);
      background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.05) 35%, rgba(0,0,0,0.05) 65%, rgba(0,0,0,0.5)); }
    .leaf.left{ border-radius:3px 3px 0 0; box-shadow: inset 0 -10px 20px -14px rgba(60,40,15,0.55); }
    .leaf.right{ border-radius:0 0 3px 3px; box-shadow: inset 0 10px 20px -14px rgba(60,40,15,0.55); }
    .leaf-text{ font-size:13px; }
    .controls{ font-size:11px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="book-wrap">
    <div class="book" id="book">
      <div class="spine"></div>
      <div class="leaf left" id="leafLeft"><div class="leaf-inner" id="innerLeft"></div></div>
      <div class="leaf right" id="leafRight"><div class="leaf-inner" id="innerRight"></div></div>
    </div>

    <div class="controls">
      <button class="nav-btn" id="prevBtn">◄ Précédente</button>
      <button class="nav-btn toc-btn" id="tocBtn">☰ Table des matières</button>
      <span class="folio-indicator" id="folioIndicator">Page 1 / 1</span>
      <button class="nav-btn" id="nextBtn">Suivante ►</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   RECUEIL — structure de données
   Pour ajouter une nouvelle nouvelle : dupliquer un objet dans STORIES,
   lui donner un id unique, un titre, et un tableau "leaves" (un élément
   de tableau = une page de texte en HTML, séparée par <p>...</p>).
   ========================================================================= */
const RECUEIL_TITLE = "Recueil de nouvelles";
const RECUEIL_AUTHOR = "Marc-André Deschênes";

const STORIES = [
  {
    id: "mise-a-jour-automatique-du-pilote",
    title: "Mise à jour automatique du pilote",
    requiredLevel: 5,
    comprehension: [
      {
        question: "Quand le copilote pousse violemment son collègue au sol au lieu de l'aider, le narrateur se demande : « Mais que lui avait-il pris ? » Selon toi, qu'est-ce que cette action du copilote permet de comprendre à ce moment de l'histoire, même si le texte ne le dit pas encore clairement ?",
        gold: 3
      },
      {
        question: "Au moment où l'avion fonce vers les gratte-ciel de Tokyo, le pilote automatique se réactive soudainement et l'avion se pose en sécurité. Plus tard, à la toute fin du texte, quel indice permet de comprendre qui a réactivé le pilote automatique ?",
        gold: 3
      },
      {
        question: "Le narrateur mentionne l'état de sa passagère une dernière fois juste avant de se lever pour intervenir dans la bagarre, laissant sa mallette sans surveillance sur son siège. À partir de ce moment, plus rien n'est dit à son sujet jusqu'à la toute fin de l'histoire. Pourquoi ce silence du texte, combiné à la mallette laissée sans surveillance, est-il une information importante pour comprendre ce qui s'est vraiment passé ?",
        gold: 3
      }
    ],
    leaves: [
`<p><span class="dropcap">J</span>e travaille pour la Gendarmerie royale du Canada. Récemment, j'ai fait un voyage en Europe afin de ramener au pays une dangereuse criminelle informatique capable d'infiltrer n'importe quel système. Heureusement pour Interpol, elle souffre également d'un syndrome du spectre de l'autisme et elle se contente de pirater pour le plaisir de le faire et ne cause généralement que de légers problèmes.</p>
<p>Cependant, elle s'est récemment fait pincer en Russie après s'être introduite dans le système informatique de divers gouvernements de plusieurs pays du monde, dont le Canada et les États-Unis. On m'a envoyé la cueillir là-bas puisqu'elle et moi nous connaissons depuis plusieurs années. En effet, je l'ai longtemps poursuivie à travers le cyberespace avant de lui mettre enfin la main au collet. Elle a toujours évité de lourdes peines carcérales puisque ses crimes furent minimes par le passé. Ce n'est pas le cas cette fois, par contre. Ce qui m'attriste de toute cette histoire, c'est que je suis convaincu qu'elle s'est fait manipuler par des crapules et que ses mauvaises intentions ne provenaient pas d'elle, mais de ses patrons russes. Ils avaient dû profiter de sa condition particulière pour se servir d'elle et utiliser son génie en informatique à mauvais escient. Peu importe comment elle avait pu faire son compte, le résultat était le même : elle s'était mise dans l'embarras et elle devra répondre de ses actes en justice.</p>`,

`<p>Lorsque je la retrouvai, à l'aéroport de Moscou, elle était en état de choc. Cela se voyait tout de suite par son état de catatonie. Elle refusait de bouger à moins que l'on ne la force à le faire. J'ai donc dû la pousser, en plaçant une main dans son dos, pour nous rendre jusqu'à nos sièges à l'intérieur de l'avion qui allait nous ramener au Canada tous les deux. Nous embarquions dans un appareil récent, équipé de technologies de pointe : le plus avancé modèle d'avion de type commercial de cette envergure, parcourant actuellement le ciel. Avant le décollage, je tentai de faire la conversation avec la prévenue que j'escortais, mais elle ne disait pas un mot. Repliée sur elle-même, elle se balançait de l'avant vers l'arrière et elle émettait parfois de petits cris, qui me faisaient chaque fois sursauter, tellement ils étaient soudains. Lorsque nous décollâmes, j'avais déjà abandonné l'idée de discuter avec elle ; elle n'allait visiblement pas bien.</p>`,

`<p><span class="dropcap">J</span>e m'étais endormi sur mon siège, juste après avoir mangé le repas que l'agente de bord m'avait servi, lorsque je fus réveillé en sursaut par des cris. En ouvrant les yeux, devant moi, à l'avant de l'avion, j'aperçus ce qui semblait être une bagarre entre deux hommes. Lorsque je remarquai que l'un d'eux portait l'uniforme de pilote, je réalisai que quelqu'un tentait de s'introduire dans le cockpit et que l'un des deux pilotes lui barrait la route. J'étais policier et je me devais d'intervenir. Je regardai à ma gauche pour constater que ma passagère spéciale n'avait pas bougé de son siège et qu'elle était dans le même état qu'au décollage. Je mis la main sur mon arme ; je devais assurer la sécurité des passagers de cet appareil. Je me levai de mon siège et laissai ma mallette sur celui-ci, déterminé à régler le conflit avant qu'il ne dégénère.</p>`,

`<p><span class="dropcap">A</span>u même moment, deux hommes se levèrent tout juste devant moi et s'engagèrent dans l'allée pour se diriger vers le cockpit. J'entrevis le copilote venir en main forte à son collègue. Je devais passer, mais ces deux individus venaient de me barrer la route. À mon plus grand étonnement, au lieu d'aider son coéquipier, le copilote poussa celui-ci violemment dans le dos, le projetant au sol, dans le milieu de l'allée. Mais que lui avait-il pris ? Je criai :</p>
<p class="dialogue no-indent">« Police, tout le monde garde son calme et restez assis ! »</p>`,

`<p><span class="dropcap">L</span>es passagers du vol se sont tous retournés en ma direction en entendant mes ordres. Les deux hommes qui me barraient la route se sont retournés aussi, mais au lieu d'obtempérer et de retourner s'asseoir, le premier fonça tête première vers l'avant de l'avion alors que le deuxième se retourna vers moi pour m'assainir un coup de poing en plein visage. Le coup fut si brutal que mes genoux flanchèrent et je dus me cramponner aux sièges de chaque côté pour éviter de m'effondrer. Alors qu'il allait me frapper de nouveau, une jeune femme portant un uniforme militaire s'interposa entre nous. Elle bloqua, avec son avant-bras, le coup que l'homme voulait me porter et elle se plaça devant moi. L'homme sembla hésiter à frapper une fille et fit un pas vers l'arrière. Elle feinta un coup de la gauche et, lorsque celui-ci voulut l'esquiver, elle lui balança le plus violent coup de pied frontal de l'histoire en plein sur la mâchoire, avec ses bottes militaires. Je le vis faire un vol plané dans le corridor central, et la femme qui m'avait secouru se rua sur lui de plus belle, alors que je reprenais mes esprits. Par-dessus la mêlée, j'aperçus les deux autres individus s'enfermer avec le copilote dans le cockpit et fermer la porte blindée derrière eux. Des terroristes venaient de prendre le contrôle de l'appareil et le copilote était leur complice. Je hurlai de toutes mes forces afin d'éviter la panique générale à bord du vol :</p>
<p class="dialogue no-indent">« Tout le monde reste bien assis, la situation est sous contrôle ! »</p>`,

`<p><span class="dropcap">L</span>es gens se mirent à crier de manière incontrôlable, et ceux qui n'étaient pas affolés jusqu'ici l'étaient forcément maintenant. Les 234 passagers du vol dans lequel je me trouvais risquaient fort bien de ne pas voir le jour se lever de nouveau si je n'arrivais pas à entrer à l'intérieur du cockpit le plus vite possible. À travers la foule, je vis le pilote de l'avion ; je devais savoir comment ouvrir cette porte et il pouvait m'aider. Je criai aux gens de s'asseoir et je parvins à rejoindre le devant de l'avion pour rejoindre le pilote. Je remerciai la militaire au passage et je fus soulagé de voir que celle-ci avait mis mon assaillant hors d'état de nuire ; il n'allait pas se lever de sitôt.</p>`,

`<p><span class="dropcap">J</span>'atteignis le commandant, qui avait du mal à reprendre ses esprits. Je lui montrai mon badge d'agent fédéral canadien et il me dit alors :</p>
<p class="dialogue no-indent">— Je n'arrive pas à croire que Ferno soit un terroriste et que je n'ai jamais rien remarqué.</p>
<p class="dialogue no-indent">— Ce n'est pas le moment, commandant, nous devons ouvrir la porte du cockpit immédiatement, répliquai-je, nous n'avions aucune minute à perdre.</p>
<p class="dialogue no-indent">— La porte est impossible à ouvrir de ce côté, c'est ainsi dans tous les appareils de cette envergure depuis les évènements de New York, vous devez bien le savoir, officier, me dit-il, d'un air résigné, comme s'il ne réalisait pas la gravité de la situation.</p>
<p class="dialogue no-indent">— Je sais, commandant, mais il doit forcément y avoir un moyen d'entrer dans ce cockpit, je refuse d'abandonner et de mourir ici.</p>
<p class="dialogue no-indent">— Le verrou est mécanique et ne s'active qu'à la main. Je vous assure, officier, elle ne s'ouvre pas de ce côté.</p>`,

`<p><span class="dropcap">J</span>e tentais de trouver une solution au problème, mais mon cerveau refusait de coopérer ; je commençais à paniquer à mon tour. Si je ne pouvais ouvrir cette porte, j'étais impuissant à intervenir et éviter la catastrophe. Je balayai l'appareil du regard pour constater que les gens s'étaient calmés un peu. Je réalisai que l'avion n'avait toujours pas changé de trajectoire ; le comportement de l'avion ne semblait pas avoir changé depuis que les terroristes étaient aux commandes. Je demandai au pilote :</p>
<p class="dialogue no-indent">— Comment se fait-il que nous soyons toujours à la même altitude ? N'ont-ils pas l'intention d'abîmer cet engin quelque part en mer ?</p>
<p class="dialogue no-indent">— Je n'ai aucune idée de ce qu'ils cherchent à faire, mais ils n'ont toujours pas désactivé le pilote automatique, nous sommes toujours à destination de Tokyo jusqu'à maintenant. Cet avion peut décoller et atterrir de lui-même, vous savez, c'est un vrai bijou d'ingénierie.</p>`,

`<p><span class="dropcap">A</span>lors qu'il élaborait les mérites de son bolide, l'avion fut secoué à plusieurs reprises par de violentes turbulences. Puis l'avion tourna brusquement vers la droite avant de se mettre à perdre de l'altitude. Je me cramponnai aux sièges et je regardai par un hublot. Je vis l'horizon passer du haut vers le bas et j'entrevis, dans l'obscurité de la nuit, les lumières d'une ville. Nous devions être en approche de Tokyo ; peu d'autres villes dans le monde ne sont aussi lumineuses que ne l'est la capitale nipponne. La panique reprit de plus belle à l'intérieur de l'avion et le commandant me cria à l'oreille :</p>
<p class="dialogue no-indent">« Voilà, le pilote automatique est désactivé. Ce salaud de Ferno a repris les commandes et il souhaite probablement transformer cet avion en missile et l'envoyer directement entrer en collision avec l'un des gratte-ciel de Tokyo. Cette fois, vous pouvez dire que nous sommes cuits, officier. »</p>`,

`<p><span class="dropcap">L</span>'avion perdait de l'altitude à un rythme de plus en plus affolant. Des masques à oxygène sortirent du plafond de l'avion et les lumières se fermèrent pour ne laisser que les voyants lumineux de secours comme éclairage. Les hurlements devenaient presque insupportables, tellement nous étions à l'étroit et nombreux. J'ai dû me boucher les oreilles à l'aide de mes mains pour continuer de réfléchir à comment j'allais nous sortir de ce pétrin. Je retournai au hublot, ne sachant que faire d'autre. Nous foncions effectivement directement vers le centre-ville et je pouvais apercevoir les grands immeubles surplombant la métropole japonaise.</p>`,

`<p><span class="dropcap">U</span>ne alarme se mit à résonner à travers le bruit infernal, pour nous avertir que la situation était grave, comme si quelqu'un ici pouvait encore en douter. C'est à ce moment que je me suis résigné. Je ne pouvais rien faire pour sauver les passagers de l'appareil et j'allais mourir dans un terrible accident d'avion. Je n'entendais plus rien autour de moi ; je voyais les gens en pleurs, tenter de rejoindre leurs proches au téléphone, probablement pour leur faire leurs adieux. Je pensai à mes parents et à mes enfants, à ma tendre épouse et à ma carrière de policier. Je revis le jour de mon mariage et la naissance de mes enfants. J'éclatai en sanglots en réalisant que je ne les reverrais plus jamais.</p>`,

`<p><span class="dropcap">S</span>oudainement, une violente secousse nous envoya nous frapper les uns contre les autres et l'avion revint brusquement en position horizontale par rapport au sol. Les lumières s'allumèrent rangée par rangée et les passagers de l'avion retinrent leur souffle. Nous avions tous le même regard d'incompréhension, et c'est alors qu'une voix féminine, provenant des haut-parleurs de l'appareil, nous avisa :</p>
<p class="dialogue no-indent">« Nous sommes présentement en approche de notre destination. Chers passagers, veuillez vous asseoir et boucler votre ceinture. Nous espérons que votre vol fut des plus agréables. Bienvenue à Tokyo. »</p>`,

`<p><span class="dropcap">N</span>ous avions changé de trajectoire et avions évité de justesse le centre-ville. Nous semblions nous diriger vers l'aéroport ; je voyais les voyants lumineux des pistes d'atterrissage à travers la fenêtre. L'avion s'était engagé dans une procédure d'atterrissage et nous allions nous poser d'un moment à l'autre. Au moment où le train d'atterrissage toucha terre, je réalisai que les terroristes étaient toujours à l'intérieur du cockpit. Nous n'étions peut-être pas morts, mais ils allaient quand même être placés en état d'arrestation, aussitôt extirpés de la cabine.</p>`,

`<p><span class="dropcap">L</span>'avion s'immobilisa au bout de la piste d'atterrissage et les membres de l'équipage déployèrent les sorties d'urgence afin que nous puissions tous sortir au plus vite. J'avais les yeux rivés sur la porte du cockpit. J'attendais qu'ils osent sortir de là, mon pistolet à la main, pointé en direction de la cabine de pilotage. J'étais prêt à les abattre s'il le fallait.</p>
<p>Je me tournai pour réaliser que tous les passagers avaient quitté l'avion. Il ne restait à bord que le commandant et moi. Il était resté, comme tout bon capitaine. Je lui demandai alors :</p>
<p class="dialogue no-indent">— Que s'est-il passé là-haut ? J'étais convaincu que nous allions y laisser notre peau.</p>
<p class="dialogue no-indent">— Le pilote automatique a été réactivé au dernier moment et l'avion s'est posé de lui-même, comme je disais qu'il pouvait le faire.</p>
<p class="dialogue no-indent">— Mais qui avait intérêt à le réactiver ? Cela ne fait aucun sens, répliquai-je, soulagé par la tournure des évènements.</p>`,

`<p><span class="dropcap">E</span>n prononçant ces paroles, je réalisai que j'en avais complètement oublié ma mission de départ. Je me tournai pour regarder en direction de mon siège. La banquette semblait vide ; j'allai vérifier pour constater que la prévenue que j'accompagnais était toujours dans l'avion, au même endroit. Seulement, maintenant, elle était assise au sol et elle avait devant elle l'écran de mon ordinateur portable, qu'elle avait installé sur le siège. Je réalisai qu'elle s'était emparée de ma mallette et qu'elle avait même contourné mon code personnel d'accès.</p>
<p>Elle me regarda droit dans les yeux. Je cliquai enfin. Je lui demandai :</p>
<p class="dialogue no-indent">« Tu as réactivé le pilote automatique de l'avion, n'est-ce pas ? »</p>
<p>Sur son visage s'afficha un large sourire de satisfaction.</p>`
    ]
  },

`<p><span class="dropcap">«</span> Ah haha, rira bien qui rira le dernier ! » Je viens de terminer l'étape finale des rénovations sur ma propriété. J'attendais que les Bernier décident enfin de déguerpir. Autrement, ils m'auraient volé l'idée et je n'aurais pu acheter leur terrain. Dorénavant, je réfléchis parfois à voix haute, puisqu'il n'y a personne pour m'entendre.</p>
<p>La valeur des propriétés dans les villes côtières ne cesse de chuter ces dernières années. Le gouvernement a tenté de mentir à la population, mais tout le monde voyait bien que le niveau des océans ne cessait de monter d'année en année. Ceux qui refusèrent de quitter leurs demeures furent dans l'obligation de les regarder perdre de la valeur chaque fois que la crue printanière arrivait. Les dommages étant considérables, plusieurs furent obligés de partir malgré eux. Ils étaient faits en chocolat ou quelque chose comme ça.</p>`,

`<p><span class="dropcap">L</span>a ville de Percé est un village fantôme depuis les dix dernières années. Ils ont tenté de sauver la région en installant un champ d'éoliennes. Ils ont installé des machines à perte de vue, dans l'océan. Ils affirmaient, à l'époque, que c'était dans le but d'économiser de l'espace terrestre. Une autre de leurs mascarades. Ils avaient anticipé le coup, ils savaient que le niveau des océans allait monter et ils voulaient protéger leur investissement. Ils ont promis de créer des milliers d'emplois. Ils ont omis de préciser qu'une fois construit, un ventilateur géant ne requiert que très peu d'entretien.</p>`,

`<p><span class="dropcap">M</span>ais un vieux loup de mer dans mon genre a plus d'un tour dans son sac. Depuis que ma région est inondée durant la moitié de l'année, les gens cèdent leurs propriétés pour des sommes pitoyables. Moi je les achète. J'ai monté tout mon mobilier à l'étage, l'eau ne se rend jamais à l'étage. De plus, j'ai une vue imprenable sur le rocher Percé du grenier.</p>
<p>Tous ont le même discours lors de la transaction. « Qu'avez-vous l'intention de faire de notre propriété ? Simple curiosité » s'empressaient-ils toujours de préciser, puisqu'ils savent bien que ça ne les regarde pas. J'ai dit aux Bernier que j'allais m'en servir pour devenir millionnaire, lorsqu'il fut trop tard pour qu'ils changent d'idée. Le vieil hypocrite n'a pu s'empêcher d'esquisser un sourire de moquerie. J'ai voulu lui déballer l'entièreté de mon plan, mais j'avais trop hâte qu'ils déguerpissent pour les retenir.</p>`,

`<p><span class="dropcap">J</span>e peux maintenant dire que la région m'appartient. Tous les voisins m'ont cédé leurs propriétés pour des sommes loufoques. Je vais y planter du riz, une immense plantation de riz. Le réchauffement des températures permet ce genre de culture dans les régions nordiques maintenant. Pour ce qui est de ma maison, j'ai pensé à tout. J'ai préparé mon propre ciment à l'épreuve de l'eau. « Ah ahah, vous riez ? Maintenant, dansez ! »</p>
<p>Je ne suis pas le premier à tenter ce genre de solution pour prévenir les infiltrations d'eau. Mais les entrepreneurs en construction n'ont pas intérêt à sauver les maisons situées à proximité des côtes. Il se construit des maisons dans le Midwest américain et dans les prairies canadiennes comme jamais auparavant. Les gens veulent s'installer le plus loin possible des étendues d'eau. Qui peut leur en vouloir de ne pas posséder mon génie créatif ?</p>`,

`<p><span class="dropcap">J</span>'ai attendu la fin de l'automne pour installer mon béton artisanal. J'ai dû sacrifier le sous-sol. Je n'y avais pas mis les pieds depuis plus d'une décennie de toute façon. Juste avant l'hiver, c'était le moment idéal pour couler mes nouvelles fondations. J'ai mis le paquet pour bien faire le travail. Ma maison va bientôt faire le tour du monde, lorsque les gens réaliseront ce que j'ai fait. Ce qu'ils n'ont jamais pensé faire. Les médias s'arracheront l'histoire de l'homme qui trouva la solution aux inondations planétaires.</p>`,

`<p><span class="dropcap">J</span>'ai également recouvert le sol avec mon ciment imperméable. Ces idiots ne faisaient que les murs de la fondation avec leur béton supposément imperméable. Ils ont dû ne jamais réaliser que l'eau finirait par s'infiltrer, tôt ou tard, par le sol et transformerait la maison en baignoire. Lorsqu'ils réaliseront que j'ai trouvé la solution, toutes les villes voudront subitement devenir la Venise des belles années, avant que celle-ci ne soit complètement engloutie par la mer. Et moi je serai milliardaire. Je donnerais bien un million pour voir la face de Bernier lorsque la nouvelle se répandra. « J'aurais dû utiliser le mot milliardaire, ça l'aurait ébranlé davantage, peu importe. »</p>`,

`<p><span class="dropcap">D</span>'ailleurs, le moment que j'attendais depuis longtemps est arrivé. La crue printanière est à son comble et l'hiver dernier nous a apporté une quantité phénoménale de neige. Le réchauffement climatique provoqua un accroissement des précipitations sur l'ensemble de l'Amérique du Nord, et ce, même en hiver. Le gouvernement a dû construire une énorme digue dans la baie, afin que les villages soient protégés des inondations printanières. La digue et les villages sont toujours debout aujourd'hui, mais aucun de ces trouillards ne veut vivre avec de l'eau au rez-de-chaussée.</p>`,

`<p><span class="dropcap">J</span>e suis allé dormir, fébrile et impatient de la venue prochaine de la gloire. J'avais pris deux somnifères, c'est ce que je fais chaque fois que je vais au lit sur l'heure du midi. J'ai eu du mal à reprendre mes esprits après le réveil brutal. Le médicament m'ayant plongé dans un sommeil sans rêves.</p>
<p>Mon lit s'est soudainement mis à cogner sur le plancher, j'étais à quelques centimètres de frapper le plafond du grenier chaque fois que le lit était propulsé dans les airs. Je me cramponnais à mes couvertures et ensuite à la tête du lit, lorsqu'une énorme vague vint frapper la fenêtre renforcée de la maison de plein fouet et me propulsa au bout du lit. Ce devait être un tsunami. La terre avait dû trembler au large. Mais pourquoi le sol continuait-il de bouger dans ce cas ?</p>`,

`<p><span class="dropcap">L</span>a maison fut secouée durant plusieurs longues secondes de manière violente. Tranquillement l'intensité des secousses diminua, mais ne cessait pas complètement. Lorsque le calme revint, je regardai à la fenêtre pour tenter de comprendre ce qui pouvait provoquer ces secousses. Ce ne pouvait être un tremblement de terre.</p>
<p>J'ai vu le rocher Percé des milliers de fois et le trou dans sa paroi n'a jamais été de ce côté auparavant. Je ne l'avais jamais vu si petit, non plus. « C'est impossible », murmurais-je à moi-même, en me précipitant pour ouvrir la trappe qui mène sur le toit de la maison. Je bondis sur le toit pour comprendre ce qui m'arriva.</p>`,

`<p><span class="dropcap">À</span> l'horizon, dans la baie, la digue avait cédé. Le ciment imperméable avait transformé la maison en navire et le torrent avait propulsé celle-ci au large, à la dérive sur l'océan Atlantique.</p>`

`<p><span class="dropcap">F</span>idèle à mes habitudes, j'avais passé la majeure partie de la nuit à écrire. Je m'affairais à terminer mon dernier livre d'astrophysique. J'étais installé à l'étage lors de sa visite, dans mon bureau, près du foyer. J'attendais sa venue et il arriva exactement à l'heure que nous avions convenu ensemble la veille, au téléphone. J'avais insisté pour qu'il vienne souper en compagnie de son épouse, mais il avait décliné l'offre, prétextant ne pas vouloir déranger et qu'il n'en avait pas pour bien longtemps, de toute façon.</p>`,

`<p><span class="dropcap">J</span>e suis allé l'accueillir en compagnie de ma femme. Nous avions affaire à un homme d'apparence plutôt banale. Vêtu d'un habit et d'une cravate, il ne prit même pas la peine d'entrer. Il me remit seulement une enveloppe avant de nous remercier et de nous saluer. Il repartit aussitôt qu'il était arrivé. J'en compris qu'il s'était déplacé seulement pour me remettre cette lettre. Intrigué, je grimpai à l'étage pour l'ouvrir immédiatement.</p>`,

`<p><span class="dropcap">À</span> l'intérieur se trouvait une multitude de documents de papier. J'ai eu du mal à décoder tout son contenu, mais j'en compris la majeure partie. Il s'agissait d'un plan détaillé indiquant la marche à suivre pour mettre en orbite un objet et ensuite s'en servir comme projectile cosmique. Mais qui pouvait bien avoir élaboré cette technique et ces formules mathématiques complexes ? Et à quoi pouvait bien servir un projectile interstellaire ? Je passai la semaine suivante à vérifier les calculs présentés dans le document et à étudier l'ensemble des éléments détaillés dans celui-ci. Les calculs étaient exacts et, bien qu'inutile, cette technique pourrait certainement valoir le prix Nobel de physique à son auteur.</p>`,

`<p><span class="dropcap">J</span>e tentai de retracer le mystérieux inconnu qui m'avait apporté cette intrigante lettre, mais sans succès. Je restai à l'affût des magazines scientifiques, mais rien ne ressemblait ni de près, ni de loin à ce que j'avais entre les mains. Je fus tenté de m'approprier le génie à ce moment-là, mais je ne le pouvais pas, ce serait l'équivalent de voler une œuvre à un artiste. Je rangeai le document dans mon coffre-fort. Les années s'écoulèrent et j'en vins même jusqu'à avoir oublié toute cette histoire. Jusqu'au jour où je n'ai eu d'autre choix que d'y repenser.</p>`,

`<p><span class="dropcap">L</span>e 3 février 2036, les habitants du globe furent tous catastrophés d'apprendre qu'une gigantesque météorite fonçait droit sur notre planète. Sa trajectoire coïncidait avec la nôtre et un impact était jugé comme inévitable, par la communauté scientifique du monde entier. Nous n'avions qu'une vingtaine de jours pour trouver une solution ou être pulvérisés. Je possédais cette solution et j'avais la crédibilité suffisante pour qu'on m'écoute. Avec de la chance, ma technique pourrait sauver la planète, à condition qu'elle soit déployée à temps.</p>`,

`<p><span class="dropcap">L</span>e président des États-Unis réunit la communauté scientifique internationale et je leur expliquai le plan que j'avais sous la main. Je leur expliquai que nous allions construire une immense boule de métal composée d'un alliage spécial que je détaillai. Nous la mettrons alors en orbite à l'aide de toutes les fusées dont nous disposons et nous la propulserons ensuite sur une trajectoire bien précise autour de la terre, que je détaillai également. Selon mes calculs, la boule que nous avons confectionnée prendra alors de la vitesse et accélérera jusqu'à ce qu'elle puisse échapper à l'attraction terrestre. Elle sera alors propulsée en direction de la météorite menaçant notre survie et ce, à grande vitesse. L'impact devrait être suffisant pour faire dévier la météorite de sa trajectoire d'un degré. Cela devrait avoir comme effet qu'elle nous évite de justesse. À condition que nous la frappions d'ici les 13 prochains jours, où il sera trop tard.</p>`,

`<p><span class="dropcap">L</span>a trentaine de personnes présentes autour de la table, dont le président des États-Unis, sont tous restés bouche bée, à me regarder stupéfaits, pendant plusieurs longues secondes. Puis la stratégie fut adoptée à l'unanimité et le branle-bas de combat s'enclencha. Les équipes furent dispersées et le chantier était déjà sur pied le soir même. Mon allocution devant le conseil de sécurité eut l'effet escompté, nous avions peut-être une chance de nous en sortir.</p>
<p>Ce furent douze journées complètement folles. Pour la première fois dans l'histoire de l'humanité, l'entièreté de la planète travaillait dans le même sens, à accomplir un objectif commun, celui de donner à nos enfants un avenir.</p>`,

`<p><span class="dropcap">À</span> la fin de la douzième journée, la mission culminait et nous sommes arrivés à lancer notre projectile en direction de la météorite. La joie que j'ai ressentie lorsque la balle de métal que nous avions confectionnée atteignit la cible, exactement à l'endroit et au moment prévu par nos calculs, est impossible à décrire. La population entière du globe était en liesse, nous étions sauvés.</p>
<p>Je fus acclamé en héros et je gagnai les prix Nobel de science, de mathématiques, de physique et même celui de la paix. J'étais l'homme le plus célèbre au monde et pourtant, je ne pouvais être fier de moi, sachant la vérité à propos de la technique qui nous avait sauvés. Quoi qu'il en fût, je n'avais eu guère le choix d'agir ainsi, ou nous ne serions pas là pour en discuter. Je profitai tout de même de mon discours devant les Nations Unies pour mettre cartes sur table. Je dévoilai au monde qu'un mystérieux inconnu m'avait un soir rendu visite chez moi pour me remettre les fameux documents. Aucun des dignitaires présents dans l'auditoire ne me prit au sérieux, ils étaient tous bien trop heureux d'être en vie pour s'en soucier, de toute façon. Je revins toutefois chez moi la conscience tranquille d'avoir dévoilé mon secret.</p>`,

`<p><span class="dropcap">J</span>e venais d'enlever mon habit pour me mettre en tenue de soirée quand la sonnette d'entrée me fit sursauter. Qui cela pouvait-il bien être à cette heure tardive ? J'allai répondre. Devant la porte d'entrée, un parapluie à la main, sous la pluie se tenait le mystérieux inconnu. Celui à qui l'humanité devait sa survie.</p>
<p class="dialogue no-indent">— Puis-je entrer, s'il vous plaît ? me demanda-t-il, toujours aussi poliment.</p>
<p class="dialogue no-indent">— Bien entendu monsieur, vous êtes ici chez vous, mon ami, répliquai-je, en lui faisant signe d'entrer.</p>`,

`<p><span class="dropcap">L</span>'homme entra et mon épouse l'aida à retirer son imperméable. Je l'invitai à s'asseoir et nous nous sommes tous les trois installés autour de la table. Il avait insisté pour que nous nous assoyions, affirmant que ce qu'il était venu nous dire allait sans aucun doute bouleverser notre existence. Intrigués, ma femme et moi avons fait comme il demandait. Il dit alors : « Maintenant que j'ai votre confiance, nous pouvons discuter. »</p>`,

`<p><span class="dropcap">I</span>l se leva, recula d'un pas et retira, de son visage, le masque qu'il portait, pour révéler sa vraie identité. Il arborait de grands yeux globuleux et une petite bouche démunie de lèvres. Son crâne était chauve et visqueux en apparence. Cela ne faisait aucun doute, il venait d'ailleurs, il était extraterrestre. Mais il était également notre sauveur et notre invité. Je me levai d'un bond et dis :</p>
<p class="dialogue no-indent">« Quel est votre nom mon ami ? Et comment pouvons-nous vous aider ? »</p>
<p>Mon épouse, elle, venait de s'évanouir sur sa chaise, tellement elle fut estomaquée par la révélation à laquelle nous venions d'assister.</p>`,

`<p><span class="dropcap">N</span>otre invité ouvrit sa valise et il prit une enveloppe, qu'il me tendit. Je l'ouvris aussitôt. Il me révélait enfin la raison de sa venue chez moi, sous la forme d'une lettre, minutieusement écrite dans notre langue, de sa main.</p>
<p style="text-indent:0; margin-top:22px;">Mes salutations distinguées, monsieur, à vous et à votre charmante épouse.</p>
<p style="text-indent:0;">Nous sommes venus en paix et avons parcouru la Voie lactée pour venir jusqu'ici vous rencontrer. Nous désirons établir, entre nos peuples, une communication qui nous sera mutuellement bénéfique. Pour ce faire, nous vous avons choisis pour nous aider à établir un lien de confiance entre nos dirigeants respectifs.</p>
<p style="text-indent:0;">Depuis une cinquantaine d'années, nous vous observons à distance afin d'apprendre à connaître votre civilisation et pour cela, nous vous prions de bien vouloir nous pardonner. Si nous vous avons espionné durant toutes ces années, ce n'était guère par malice, mais bien par précautions. Nous devions d'abord mesurer l'impact qu'aurait notre venue sur le développement de votre civilisation. Nous avons patiemment attendu le bon moment avant de nous manifester et celui-ci est maintenant venu.</p>
<p style="text-indent:0;">Je me nomme Memphis, je suis l'ambassadeur de mon peuple. Enchanté de vous connaître.</p>
<p style="text-indent:0;">Alors, comment suggérez-vous de nous présenter à vos compatriotes, mon ami ?</p>`
