async function renderEvocationsSection(){
  const section = EVOCATIONS_DATA.find(s => s.id === view.id);
  if(!section){ view = {mode:"evoc-liste"}; render(); return; }
  evocReponsesSaisies = {};

  const texteSouligne = souligneMots(section.texte, section.motsUtilises);

  let exercicesHtml = "";
  let dernierCategorie = null;
  section.exercices.forEach((ex, i) => {
    if(ex.categorie !== dernierCategorie){
      exercicesHtml += `<div class="evoc-cat-title">${ex.categorie}</div>`;
      dernierCategorie = ex.categorie;
    }
    exercicesHtml += `<div class="evoc-question" id="evocQ-${i}">
      <span class="evoc-q-indice">${i+1}. ${formulerConsigneEvoc(ex.categorie, ex.indice)}</span>
      ${window.TypesDeReponse.obtenir('mot').rendreChamps({}, i)}
    </div>`;
  });

  app.innerHTML = `<div class="evoc-conteneur"><div class="evoc-contenu">
    <div class="evoc-barre"><span class="back-link" id="backToEvocListe">← Retour aux Invocations</span></div>
    <h2>${section.titre}</h2>
    <div class="evoc-texte">${texteSouligne}</div>
    <div id="evocExosWrap">${exercicesHtml}</div>
    <button class="evoc-submit-btn" id="evocSubmitBtn">Corriger mes réponses</button>
    <div id="evocScoreZone"></div>
    <button class="retour-bas" id="evocRetourBas" type="button">← Retour aux Invocations</button>
  </div></div>`;

  const quitterSection = () => { fermerVocabPanel(); view = {mode:"evoc-liste"}; render(); };
  document.getElementById("backToEvocListe").addEventListener("click", quitterSection);
  document.getElementById("evocRetourBas").addEventListener("click", quitterSection);
  afficherVocabPanel(section);
  document.getElementById("evocSubmitBtn").addEventListener("click", () => corrigerEvocations(section));
}

function corrigerEvocations(section){
  const typeDef = window.TypesDeReponse.obtenir('mot');
  let score = 0;
  section.exercices.forEach((ex, i) => {
    const valeurs = typeDef.lireValeurs(i);
    const q = { reponse: { val: ex.reponse } };
    const correcte = typeDef.estCorrecte(q, valeurs);
    tentativeRapport(i + 1, valeurs.val, correcte);
    if(correcte) score++;
    const row = document.getElementById("evocQ-" + i);
    row.classList.remove("correcte", "incorrecte");
    row.classList.add(correcte ? "correcte" : "incorrecte");
  });

  document.getElementById("evocScoreZone").innerHTML =
    `<div class="evoc-score">Score : ${score} / 20</div>`;
  if(window.Rapports) window.Rapports.termine();   // même règle que le jeu : la section compte dès sa première correction
  fermerVocabPanel();

  (async () => {
    const prog = await chargerProgressionEvoc(section.id);
    const premiere = prog.meilleurScore == null;
    const meilleurScore = (prog.meilleurScore == null || score > prog.meilleurScore) ? score : prog.meilleurScore;
    await sauvegarderProgressionEvoc(section.id, { meilleurScore, derniereTentative: score });
    await calculerInvocationsTerminees();
    if(premiere) afficherGainXP("evocScoreZone", XP_PAR_SECTION);
    await verifierPromotionRangInvocations();
  })();
}

// Calcule combien des 10 sections d'Évocations sont terminées (score déjà
// enregistré au moins une fois), et met à jour le cache utilisé par
// chapterUnlocked() pour savoir si le Chapitre 2 doit se débarrer.
async function calculerInvocationsTerminees(){
  // Les 10 lectures partent en même temps (regroupées en une seule requête dans la version de classe).
  const progs = await Promise.all(EVOCATIONS_DATA.map(section => chargerProgressionEvoc(section.id)));
  const n = progs.filter(prog => prog.meilleurScore != null).length;
  invocationsToutesTerminees = n >= EVOCATIONS_DATA.length;
  evocNbTerminees = n;
  return n;
}

// Recalcule combien des 10 sections d'Évocations sont terminées et met à
// jour le cache utilisé par chapterUnlocked(). Le rang, lui, n'est plus
// accordé ici : il vient de la réussite du boss (l'épreuve de promotion),
// comme pour tous les autres chapitres — voir promouvoirRang().
async function verifierPromotionRangInvocations(){
  await calculerInvocationsTerminees();
  await promouvoirRang();
}

/* ---------------- Panneau flottant de la liste de vocabulaire ----------------
   Document compagnon non-bloquant : s'ouvre automatiquement à l'entrée d'une
   section, reste déplaçable (glisser la bannière), et ne se ferme que si
   l'élève corrige ses réponses ou retourne à la liste des sections. */
let vocabPanelPos = null; // { left, top } en px, mémorisé tant que la page reste ouverte

function afficherVocabPanel(section){
  const grid = document.getElementById("vocabPopupGrid");
  grid.innerHTML = [...section.vocabulaire].map(m => `<div>${m}</div>`).join("");
  document.getElementById("vocabToggle").classList.add("visible");
  // Sur un petit écran, la liste ne s'ouvre pas d'elle-même (elle cacherait la page) : le bouton « Vocabulaire » l'ouvre.
  if(window.innerWidth >= 1200) ouvrirVocabPanel(); else masquerVocabPanel();
}

function ouvrirVocabPanel(){
  const panel = document.getElementById("vocabPanel");
  panel.classList.add("open");
  document.body.classList.add("vocab-ouvert");
  document.getElementById("vocabToggle").classList.remove("visible");
  if(vocabPanelPos){
    panel.style.left = vocabPanelPos.left + "px";
    panel.style.top = vocabPanelPos.top + "px";
    panel.style.right = "auto";
  } else if(!panel.style.left){
    // Position par défaut : coin supérieur droit.
    const marge = 18;
    panel.style.top = marge + "px";
    panel.style.left = (window.innerWidth - panel.offsetWidth - marge) + "px";
  }
  clampVocabPanelPosition();
  ajusterListeVocab();
}

// Cache la liste mais garde le bouton pour la rouvrir (utile sur petit écran ou pour voir le texte en entier).
function masquerVocabPanel(){
  document.getElementById("vocabPanel").classList.remove("open");
  document.body.classList.remove("vocab-ouvert");
  document.getElementById("vocabToggle").classList.add("visible");
}

// Quitte la section : la liste et son bouton disparaissent.
function fermerVocabPanel(){
  document.getElementById("vocabPanel").classList.remove("open");
  document.body.classList.remove("vocab-ouvert");
  document.getElementById("vocabToggle").classList.remove("visible");
}

// Fait entrer TOUS les mots dans le panneau, sans défilement : on cherche la plus grande taille de police
// pour laquelle le nombre de colonnes nécessaires tient dans la largeur disponible.
function ajusterListeVocab(){
  const panel = document.getElementById("vocabPanel");
  if(!panel.classList.contains("open")) return;
  const grid = document.getElementById("vocabPopupGrid");
  const corps = panel.querySelector(".vocab-panel-body");
  const hint = corps.querySelector(".vocab-panel-hint");
  const mots = grid.children, n = mots.length;
  if(!n) return;
  const cs = getComputedStyle(corps);
  const largeur = corps.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const hauteur = corps.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
                  - hint.offsetHeight - parseFloat(getComputedStyle(hint).marginBottom || 0);
  let plusLong = 0;
  for(const m of mots) plusLong = Math.max(plusLong, m.textContent.length);
  let choix = null;
  for(let px = 16; px >= 9; px -= 0.5){
    const ligne = Math.ceil(px * 1.4);
    const lignes = Math.max(1, Math.floor(hauteur / ligne));
    const colonnes = Math.ceil(n / lignes);
    const largeurCol = plusLong * px * 0.5 + 12;
    if(colonnes * largeurCol + (colonnes - 1) * 14 <= largeur){ choix = { px, ligne, lignes, colonnes }; break; }
  }
  if(!choix){   // écran minuscule : plus petit possible, avec défilement en dernier recours
    const px = 9, ligne = 13, lignes = Math.max(1, Math.floor(hauteur / ligne));
    choix = { px, ligne, lignes, colonnes: Math.ceil(n / lignes) };
  }
  grid.style.fontSize = choix.px + "px";
  grid.style.gridTemplateRows = `repeat(${choix.lignes}, ${choix.ligne}px)`;
  grid.style.gridTemplateColumns = `repeat(${choix.colonnes}, minmax(0, 1fr))`;
  grid.style.lineHeight = choix.ligne + "px";
}

document.getElementById("vocabPanelClose").addEventListener("click", masquerVocabPanel);
document.getElementById("vocabToggle").addEventListener("click", ouvrirVocabPanel);
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && document.getElementById("vocabPanel").classList.contains("open")) masquerVocabPanel();
});

function clampVocabPanelPosition(){
  const panel = document.getElementById("vocabPanel");
  const marge = 6;
  const maxLeft = window.innerWidth - panel.offsetWidth - marge;
  const maxTop = window.innerHeight - panel.offsetHeight - marge;
  let left = parseFloat(panel.style.left) || 0;
  let top = parseFloat(panel.style.top) || 0;
  left = Math.min(Math.max(left, marge), Math.max(marge, maxLeft));
  top = Math.min(Math.max(top, marge), Math.max(marge, maxTop));
  panel.style.left = left + "px";
  panel.style.top = top + "px";
  panel.style.right = "auto";
  vocabPanelPos = { left, top };
}

(function initVocabPanelDrag(){
  const panel = document.getElementById("vocabPanel");
  const poignee = document.getElementById("vocabPanelHeader");
  let entrain = false, decalX = 0, decalY = 0;

  poignee.addEventListener("pointerdown", (e) => {
    if(e.target.closest && e.target.closest(".vocab-panel-close")) return;   // le bouton « Masquer » ne déplace pas le panneau
    entrain = true;
    poignee.setPointerCapture(e.pointerId);
    const rect = panel.getBoundingClientRect();
    decalX = e.clientX - rect.left;
    decalY = e.clientY - rect.top;
  });
  poignee.addEventListener("pointermove", (e) => {
    if(!entrain) return;
    panel.style.left = (e.clientX - decalX) + "px";
    panel.style.top = (e.clientY - decalY) + "px";
    panel.style.right = "auto";
  });
  function relacher(){ if(entrain){ entrain = false; clampVocabPanelPosition(); } }
  poignee.addEventListener("pointerup", relacher);
  poignee.addEventListener("pointercancel", relacher);
  window.addEventListener("resize", () => { if(document.getElementById("vocabPanel").classList.contains("open")){ clampVocabPanelPosition(); ajusterListeVocab(); } });
})();

/* ---------------- Chapter view (list of texts) ---------------- */
function renderChapterView(){
  if(DATA[view.ch] && DATA[view.ch].isConjurations){ view = {mode:"conj-liste"}; render(); return; }
  const ci = view.ch;
  const chapter = DATA[ci];
  const level = LEVELS[ci] || "?";
  const chapterDone = chapter.texts.every((t, ti) => itemDone(ci, ti, t));
  const nextLevel = LEVELS[ci + 1];
  let html = `<div class="back-link" id="backToToc">← Retour à la table des matières</div><div class="card">
    <div style="text-align:center;margin-bottom:6px;"><span class="rank-badge">Niveau : ${level}</span></div>
    <div style="font-family:'Cinzel Decorative', serif;font-size:20px;text-align:center;margin-bottom:16px;">${chapter.title}</div>`;
  chapter.texts.forEach((t, ti) => {
    const kindLabel = KIND_LABELS[t.kind] || "";
    if(t.placeholder){
      html += `<div class="text-row locked">
        <div class="text-icon"><img class="seal-icon" src="livre_assets/sceau_verrouillage.png" alt="Verrouillé"></div>
        <div class="text-title">${kindLabel ? `<span class="kind-tag">${kindLabel}</span>` : ""}${t.title}</div>
        <div class="text-status a-faire">À venir</div>
      </div>`;
      return;
    }
    if(t.kind === "promotion"){
      const debloque = chapter.texts.every((autre, ai) => ai === ti || itemDone(ci, ai, autre));
      const st = debloque ? ensurePromotionState(ci, ti) : null;
      const fait = debloque && itemDone(ci, ti, t);
      const nbReussis = debloque ? (st.sousExercices[0].statut === "reussi" ? 1 : 0) + (st.sousExercices[1].statut === "reussi" ? 1 : 0) : 0;
      const statusTxt = !debloque ? "Termine le contenu précédent" : fait ? "Réussi ✓" : `${nbReussis}/2 réussi(s)`;
      html += `<div class="text-row ${!debloque ? "locked" : fait ? "promo-done" : "promotion-ready"}" ${debloque ? `data-promo="${ti}"` : ""}>
        <div class="text-icon">${debloque ? "🏅" : '<img class="seal-icon" src="livre_assets/sceau_verrouillage.png" alt="Verrouillé">'}</div>
        <div class="text-title">${kindLabel ? `<span class="kind-tag">${kindLabel}</span>` : ""}${t.title}</div>
        <div class="text-status ${fait ? "reussi" : "a-faire"}">${statusTxt}</div>
      </div>`;
      return;
    }
    const s = ensureState(ci, ti).status;
    const icon = s === "reussi" ? "✅" : s === "soumis" ? "⏳" : "📜";
    const label = s === "reussi" ? "Réussi ✓" : s === "soumis" ? "En attente de correction" : "À faire";
    html += `<div class="text-row" data-t="${ti}">
      <div class="text-icon">${icon}</div>
      <div class="text-title">${kindLabel ? `<span class="kind-tag">${kindLabel}</span>` : ""}${t.title}</div>
      <div class="text-status ${s}">${label}</div>
    </div>`;
  });
  if(chapterDone && nextLevel){
    html += `<p style="text-align:center;color:var(--green);font-weight:600;margin-top:14px;">🎉 Chapitre complété — tu es ${nextLevel} !</p>`;
  }
  html += `</div>`;
  app.innerHTML = html;
  document.getElementById("backToToc").addEventListener("click", () => { view = {mode:"toc"}; render(); });
  app.querySelectorAll(".text-row[data-t]").forEach(row => {
    row.addEventListener("click", () => {
      const ti = parseInt(row.dataset.t,10);
      const kind = chapter.texts[ti].kind;
      view = { mode: kind === "conjugaison" ? "conjugaison-hub" : "text", ch:ci, text: ti };
      render();
    });
  });
  app.querySelectorAll(".text-row[data-promo]").forEach(row => {
    row.addEventListener("click", () => { view = {mode:"promotion-hub", ch:ci, text: parseInt(row.dataset.promo,10)}; render(); });
  });
}

/* ---------------- Text + questionnaire view ---------------- */
/* ---------------- Épreuve de promotion (paires d'homophones) ----------------
   Insérée en toute fin de chapitre, verrouillée jusqu'à ce que le reste du
   chapitre soit terminé. Contient 2 exercices (une paire de sujets
   d'homophones) ; réussir les deux (10/15 chacun) complète le chapitre et
   accorde le rang suivant — sans or, sans autre récompense. */
function renderPromotionHub(){
  const ci = view.ch, ti = view.text;
  const chapter = DATA[ci];
  const t = chapter.texts[ti];
  const paire = HOMOPHONE_PAIRES[t.paireIndex];
  const st = ensurePromotionState(ci, ti);
  let html = `<div class="back-link" id="backToChapter">← Retour au chapitre</div><div class="card">
    <div style="font-family:'Cinzel Decorative', serif;font-size:20px;text-align:center;margin-bottom:6px;">🏅 Épreuve de promotion</div>
    <p style="text-align:center;color:var(--ink-soft);margin-bottom:18px;">${(ci === 0 || ci === 1) ? `Réussis les 2 exercices (10/15 chacun) : ${XP_PAR_EXERCICE_BOSS} XP par exercice réussi.` : `Réussis les 2 exercices (10/15 chacun) pour gravir un échelon.`}</p>`;
  paire.forEach((topicIdx, subIdx) => {
    const topic = HOMOPHONES_TOPICS[topicIdx];
    const sousSt = st.sousExercices[subIdx];
    const dispo = subIdx === 0 || st.sousExercices[0].statut === "reussi";
    const fait = sousSt.statut === "reussi";
    const label = fait ? "Réussi ✓" : dispo ? "À faire" : "Termine l'exercice précédent";
    html += `<div class="text-row ${!dispo ? "locked" : fait ? "promo-done" : ""}" ${dispo ? `data-sub="${subIdx}"` : ""}>
      <div class="text-icon">${!dispo ? '<img class="seal-icon" src="livre_assets/sceau_verrouillage.png" alt="Verrouillé">' : fait ? "✅" : "📜"}</div>
      <div class="text-title">Exercice ${subIdx+1} — ${topic.title}</div>
      <div class="text-status ${fait ? "reussi" : "a-faire"}">${label}</div>
    </div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
  document.getElementById("backToChapter").addEventListener("click", () => {
    view = DATA[ci].isInvocations ? {mode:"evoc-liste"} : DATA[ci].isConjurations ? {mode:"conj-liste"} : {mode:"chapter", ch:ci};
    render();
  });
  app.querySelectorAll(".text-row[data-sub]").forEach(row => {
    row.addEventListener("click", () => startPromotionExercise(ci, ti, parseInt(row.dataset.sub,10)));
  });
}

function startPromotionExercise(ci, ti, subIdx){
  const t = DATA[ci].texts[ti];
  const paire = HOMOPHONE_PAIRES[t.paireIndex];
  const topicIdx = paire[subIdx];
  view = {
    mode:"promotion-exercise", ch:ci, text:ti, sub:subIdx, topicIdx, q:0,
    answers: new Array(15).fill(null),
    optionOrder: HOMOPHONES_TOPICS[topicIdx].sentences.map(() => (Math.random() < 0.5 ? [1,0] : [0,1]))
  };
  render();
}

function renderPromotionExercise(){
  const { topicIdx, q, answers, optionOrder } = view;
  const topic = HOMOPHONES_TOPICS[topicIdx];
  const [sentence] = topic.sentences[q];
  const parts = sentence.split("___");
  const opts = optionOrder[q].map(idx => topic.options[idx]);
  const selected = answers[q];

  app.innerHTML = `<div class="card">
    <div class="ex-header">
      <div class="ex-title">${topic.title}</div>
      <div class="ex-progress">Question ${q+1} / 15</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${(q/15)*100}%"></div></div>
    <div class="sentence">${parts[0]}<span class="blank-space">&nbsp;&nbsp;&nbsp;</span>${parts[1]||""}</div>
    <div class="choices">
      ${opts.map(o => `<button class="choice-word ${selected===o ? "selected" : ""}" data-word="${o}"><span class="ring"></span>${o}</button>`).join("")}
    </div>
    <div class="feedback-row">${selected ? "Réponse choisie." : "Choisis ta réponse."}</div>
  </div>`;

  app.querySelectorAll(".choice-word").forEach(btn => {
    btn.addEventListener("click", () => {
      view.answers[q] = btn.dataset.word;
      render();
      if(q < 14) setTimeout(() => { view.q = q + 1; render(); }, 250);
      else setTimeout(() => finishPromotionExercise(), 250);
    });
  });
}

function finishPromotionExercise(){
  const { ch:ci, text:ti, sub, topicIdx, answers } = view;
  const topic = HOMOPHONES_TOPICS[topicIdx];
  let score = 0;
  topic.sentences.forEach(([sentence, answer], i) => {
    const bonne = !!(answers[i] && answers[i].toLowerCase() === answer.toLowerCase());
    if(bonne) score++;
    if(window.Rapports && answers[i]) window.Rapports.tentative(i + 1, bonne);
  });
  const passed = score >= 10;
  if(passed && window.Rapports) window.Rapports.termine();
  const st = ensurePromotionState(ci, ti);
  const premiereReussite = passed && st.sousExercices[sub].statut !== "reussi";
  if(passed){ st.sousExercices[sub].statut = "reussi"; sauvegarderPromotion(ci, ti); }

  const xp = (premiereReussite && (ci === 0 || ci === 1)) ? XP_PAR_EXERCICE_BOSS : 0;
  view = {mode:"promotion-results", ch:ci, text:ti, sub, topicIdx, answers, score, passed, xp};
  render();

  if(passed) promouvoirRang(ci);
}

function renderPromotionResults(){
  const { ch:ci, text:ti, topicIdx, answers, score, passed } = view;
  const topic = HOMOPHONES_TOPICS[topicIdx];

  let rowsHtml = "";
  topic.sentences.forEach(([sentence, answer], i) => {
    const parts = sentence.split("___");
    const given = answers[i];
    const correct = given && given.toLowerCase() === answer.toLowerCase();
    rowsHtml += `<li class="result-row ${correct ? "correct" : "incorrect"}">
      <div class="result-sentence">${parts[0]}<b>${answer}</b>${parts[1]||""}</div>
      <div class="result-your-answer">${correct
        ? "Ta réponse : " + given + " ✓"
        : "Ta réponse : " + (given || "(aucune)") + " ✗ — la bonne réponse était « <span class=\"correct-word\">" + answer + "</span> »"}</div>
    </li>`;
  });

  const bannerExtra = passed
    ? `<div class="pass-msg">Bravo, 10/15 ou plus !</div>${view.xp ? `<div class="xp-gain">✨ +${view.xp} XP  ·  ${xpTotal()} XP au total</div>` : ""}`
    : `<div class="retry-msg">Il te faut au moins 10/15. Tu dois recommencer cet exercice depuis le début.</div>`;

  app.innerHTML = `<div class="card">
    <div class="ex-title" style="text-align:center;margin-bottom:6px;">Correction — ${topic.title}</div>
    <div class="score-banner">
      <div class="big-score">${score} / 15</div>
      ${bannerExtra}
    </div>
    <ul class="results-list">${rowsHtml}</ul>
    <div class="btn-row">
      <button class="next-btn" id="promoBackBtn">Retour à l'épreuve de promotion</button>
    </div>
  </div>`;

  document.getElementById("promoBackBtn").addEventListener("click", () => {
    view = {mode:"promotion-hub", ch:ci, text:ti};
    render();
  });
}

/* Accorde le rang suivant (une seule fois) et affiche la célébration plein écran.
   Le rang = nombre de chapitres terminés d'affilée depuis le chapitre 1. */
async function promouvoirRang(ci){
  if(!identiteEleve || !window.PasserelleCore) return;
  await calculerInvocationsTerminees();
  await chargerToutesConj();
  const nouveau = niveauEleve();
  const nextLevel = LEVELS[nouveau];
  const xp = xpTotal();
  let genre = null, monte = false;
  try{
    const resultat = await window.PasserelleCore.chargerCoffre(identiteEleve.slug, identiteEleve.nom);
    const coffre = resultat.donnees;
    genre = coffre.genre;
    let change = false;
    // Les XP et le rang sont écrits dans le coffre : c'est de là que la fiche de personnage les lit.
    if((coffre.xp || 0) !== xp){ coffre.xp = xp; change = true; }
    if(nextLevel && nouveau > (coffre.niveauLecture || 0)){ coffre.niveauLecture = nouveau; monte = true; change = true; }
    if(change){
      coffre.nom = identiteEleve.nom;
      await window.PasserelleCore.sauvegarderCoffre(identiteEleve.slug, coffre);
    }
  }catch(e){ monte = false; /* la promotion sera revérifiée à la prochaine visite du menu */ }
  if(monte) afficherLevelUp(genre, nextLevel);
}

function afficherLevelUp(genre, nextLevel){
  const img = document.getElementById("levelupImg");
  img.src = "couverture_assets/levelup_" + (genre === "fille" ? "fille" : "garcon") + ".jpg";
  document.getElementById("levelupSousTitre").textContent = "Tu es maintenant " + nextLevel + " !";
  document.getElementById("levelupOverlay").classList.add("open");
}
document.getElementById("levelupConfirmBtn").addEventListener("click", () => {
  if(!identiteEleve) return;
  window.location.href = "interface_eleve.html?eleve=" + encodeURIComponent(identiteEleve.slug) + "&nom=" + encodeURIComponent(identiteEleve.nom);
});

/* ---------------- Conjurations : liste des thèmes + section corrigée automatiquement ----------------
   Même logique que les Invocations (chapitre 1) : les thèmes se débarrent l'un après l'autre, chaque section se corrige
   avec « Corriger mes réponses » (score enregistré), et l'épreuve de promotion — les homophones — est le boss du chapitre.
   Les feuilles imprimables d'origine restent dans chapitre2_conjugaison/ ; leur contenu est dans conjugaison-data.js. */
const SCEAU_HTML = '<img class="seal-icon" src="livre_assets/sceau_verrouillage.png" alt="Verrouillé">';

// Vignette du thème : chapitre2_conjugaison/Mini/<slug>.webp (ex. chrono-bot.webp) ; sans image, l'emoji du thème reste.
function miniOuEmoji(t){
  return `<img class="conj-mini" src="chapitre2_conjugaison/Mini/${t.slug}.webp" alt="" draggable="false" onerror="this.replaceWith(document.createTextNode('${t.emoji}'))">`;
}

function renderConjurationsListe(){
  const ci = 1, ch = DATA[ci];
  let html = `<div class="back-link" id="backToTocFromConj">← Retour à la table des matières</div>
    <h2 class="conj-titre-liste">🔮 Conjurations</h2>
    <p class="conj-intro">Conjugaison par thème — chaque section corrigée rapporte ${XP_PAR_SECTION} XP, puis affronte l'épreuve de promotion (${XP_PAR_EXERCICE_BOSS} XP par exercice réussi).</p>
    <div id="conjListeItems">`;
  let precedenteTerminee = true;
  ch.texts.forEach(t => {
    if(t.kind !== "conjugaison") return;
    if(t.placeholder){
      html += `<div class="evoc-liste-item locked">
        <span class="evoc-liste-num">${SCEAU_HTML}</span>
        <span class="evoc-liste-titre">${t.title}<small class="conj-sous">${t.sousTitre}</small></span>
        <span class="evoc-liste-score">À venir</span>
      </div>`;
      return;
    }
    const debloquee = precedenteTerminee;
    const terminee = conjThemeDone(t.themeId);
    const p = conjProgression[t.themeId] || {};
    const scores = [1, 2].map(s => p[s] && p[s].meilleurScore).filter(x => x != null);
    const scoreTxt = scores.length ? `Meilleur score : ${Math.max(...scores)}/${CONJ_TOTAL_PAR_SERIE}` : (debloquee ? "Pas encore fait" : "Termine la section précédente");
    html += `<div class="evoc-liste-item${debloquee ? "" : " locked"}" ${debloquee ? `data-theme="${t.themeId}"` : ""}>
      <span class="evoc-liste-num">${debloquee ? miniOuEmoji(t) : SCEAU_HTML}</span>
      <span class="evoc-liste-titre">${t.title}<small class="conj-sous">${t.sousTitre}</small></span>
      <span class="evoc-liste-score">${scoreTxt}</span>
    </div>`;
    precedenteTerminee = terminee;
  });
  // Épreuve de promotion : le boss du chapitre, débarré une fois tous les thèmes terminés.
  const iBoss = ch.texts.findIndex(t => t.kind === "promotion");
  if(iBoss >= 0){
    const bossDebloque = precedenteTerminee;
    const bossFait = bossDebloque && itemDone(ci, iBoss, ch.texts[iBoss]);
    let bossNb = 0;
    if(bossDebloque){
      const st = ensurePromotionState(ci, iBoss);
      bossNb = (st.sousExercices[0].statut === "reussi" ? 1 : 0) + (st.sousExercices[1].statut === "reussi" ? 1 : 0);
    }
    const bossStatus = !bossDebloque ? "Termine les 5 sections" : bossFait ? "Réussi ✓" : `${bossNb}/2 réussi(s)`;
    html += `<div class="evoc-liste-item ${!bossDebloque ? "locked" : bossFait ? "promo-done" : "promotion-ready"}" ${bossDebloque ? `data-boss="${iBoss}"` : ""}>
      <span class="evoc-liste-num">${bossDebloque ? "🏅" : SCEAU_HTML}</span>
      <span class="evoc-liste-titre">Épreuve de promotion</span>
      <span class="evoc-liste-score">${bossStatus}</span>
    </div>`;
  }
  html += `</div>`;
  app.innerHTML = html;
  document.getElementById("backToTocFromConj").addEventListener("click", () => { view = {mode:"toc"}; render(); });
  app.querySelectorAll(".evoc-liste-item[data-theme]").forEach(item => {
    item.addEventListener("click", () => { view = {mode:"conj-section", themeId: parseInt(item.dataset.theme, 10), serie: 1}; render(); });
  });
  const bossRow = app.querySelector(".evoc-liste-item[data-boss]");
  if(bossRow) bossRow.addEventListener("click", () => { view = {mode:"promotion-hub", ch:ci, text: parseInt(bossRow.dataset.boss, 10)}; render(); });
}

function renderConjSection(){
  const themeId = view.themeId, serie = view.serie || 1;
  const t = DATA[1].texts.find(x => x.themeId === themeId);
  const contenu = window.CONJUGAISON_DATA && window.CONJUGAISON_DATA[themeId];
  if(!t || !contenu){ view = {mode:"conj-liste"}; render(); return; }
  const sections = contenu.series[serie - 1];
  const typeMot = window.TypesDeReponse.obtenir("mot");
  const prog = conjProgression[themeId] || {};
  const badge = s => (prog[s] && prog[s].meilleurScore != null) ? ` · ${prog[s].meilleurScore}/${CONJ_TOTAL_PAR_SERIE}` : "";

  const attendues = [];
  let corps = "";
  sections.forEach(sec => {
    corps += `<div class="conj-temps"><h3>${sec.titre}</h3><div class="conj-refs">` +
      sec.refs.map(ref => `<div class="conj-ref"><div class="conj-ref-titre">${ref.verbe} — ${ref.temps.toLowerCase()}</div>` +
        ref.lignes.map(([pron, forme]) => `<div>${pron} <b>${forme}</b></div>`).join("") + `</div>`).join("") +
      `</div><div class="conj-groupes">`;
    sec.groupes.forEach(g => {
      corps += `<div class="conj-groupe"><div class="conj-groupe-titre">${g.titre}</div>`;
      g.items.forEach(([pron, rep, suite]) => {
        const i = attendues.length;
        attendues.push(rep);
        corps += `<div class="conj-q" id="conjQ-${i}"><b${/['’]$/.test(pron) ? ' class="elide"' : ""}>${pron}</b>${typeMot.rendreChamps({}, i)}<span>${suite}</span></div>`;
      });
      corps += `</div>`;
    });
    corps += `</div></div>`;
  });
  view.attendues = attendues;

  app.innerHTML = `<div class="conj-barre"><span class="back-link" id="backToConjListe">← Retour aux Conjurations</span></div>
    <div class="conj-entete">${t.emoji} ${t.title}</div>
    <div class="conj-sous-titre">${t.sousTitre}</div>
    <div class="conj-series">
      <button class="conj-serie-btn ${serie === 1 ? "actif" : ""}" data-serie="1" type="button">Série 1${badge(1)}</button>
      <button class="conj-serie-btn ${serie === 2 ? "actif" : ""}" data-serie="2" type="button">Série 2${badge(2)}</button>
    </div>
    ${corps}
    <button class="evoc-submit-btn" id="conjSubmitBtn" type="button">Corriger mes réponses</button>
    <div id="conjScoreZone"></div>
    <button class="retour-bas" id="conjRetourBas" type="button">← Retour aux Conjurations</button>`;

  const retour = () => { view = {mode:"conj-liste"}; render(); };
  document.getElementById("backToConjListe").addEventListener("click", retour);
  document.getElementById("conjRetourBas").addEventListener("click", retour);
  app.querySelectorAll(".conj-serie-btn").forEach(b => b.addEventListener("click", () => {
    view = {mode:"conj-section", themeId, serie: parseInt(b.dataset.serie, 10)}; render();
  }));
  document.getElementById("conjSubmitBtn").addEventListener("click", corrigerConj);
}

function corrigerConj(){
  const { themeId, serie, attendues } = view;
  const typeMot = window.TypesDeReponse.obtenir("mot");
  let score = 0;
  attendues.forEach((rep, i) => {
    const valeurs = typeMot.lireValeurs(i);
    const correcte = typeMot.estCorrecte({ reponse:{ val: rep } }, valeurs);
    tentativeRapport(i + 1, valeurs.val, correcte);
    if(correcte) score++;
    const row = document.getElementById("conjQ-" + i);
    row.classList.remove("correcte", "incorrecte");
    row.classList.add(correcte ? "correcte" : "incorrecte");
  });
  const total = attendues.length;
  if(window.Rapports) window.Rapports.termine();
  document.getElementById("conjScoreZone").innerHTML = `<div class="evoc-score">Score : ${score} / ${total}</div><div id="conjMessage"></div>`;
  (async () => {
    const prog = await chargerProgressionConj(themeId, serie);
    const meilleurScore = (prog.meilleurScore == null || score > prog.meilleurScore) ? score : prog.meilleurScore;
    const avant = conjThemeDone(themeId);
    await sauvegarderProgressionConj(themeId, serie, { meilleurScore, derniereTentative: score });
    conjProgression[themeId] = conjProgression[themeId] || {};
    conjProgression[themeId][serie] = { meilleurScore, derniereTentative: score };
    const zone = document.getElementById("conjMessage");
    if(zone && !avant && conjThemeDone(themeId)){
      zone.innerHTML = `<p class="conj-fin">✅ Section terminée ! Tu peux passer à la suivante.</p>`;
      afficherGainXP("conjMessage", XP_PAR_SECTION);
    }
    await promouvoirRang();
  })();
}

function renderTextView(){
  const {ch, text} = view;
  const t = DATA[ch].texts[text];
  if(t.type === "writing"){ renderWritingView(ch, text); return; }
  const st = ensureState(ch, text);
  const locked = st.status !== "a-faire";

  let bodyHtml = "";
  t.body.forEach(block => {
    if(block.h) bodyHtml += `<h4>${block.h}</h4>`;
    else bodyHtml += `<p>${block.p}</p>`;
  });

  let banner = "";
  if(st.status === "soumis") banner = `<div class="status-banner soumis">⏳ Remis — en attente de correction par l'enseignant.</div>`;
  if(st.status === "reussi") banner = `<div class="status-banner reussi">✅ Réussi !</div>`;

  let qHtml = "";
  t.questions.forEach(q => {
    const header = q.heading || ("Question " + q.num);
    if(q.type === "matching"){
      qHtml += `<div class="question-block"><div class="question-num">${header}</div><div class="question-prompt">${q.prompt}</div>${renderMatchingHtml(q, st, locked)}</div>`;
    } else if(q.note){
      qHtml += `<div class="question-block"><div class="question-num">${header}</div><div class="note-box">${q.note}</div></div>`;
    } else {
      const key = q.num || q.heading;
      const val = st.answers[key] || "";
      qHtml += `<div class="question-block">
        <div class="question-num">${header}</div>
        <div class="question-prompt">${q.prompt}</div>
        <textarea data-q="${key}" ${locked ? "disabled" : ""} rows="2">${val}</textarea>
      </div>`;
    }
  });

  app.innerHTML = `<div class="back-link" id="backToChapter">← Retour aux textes du chapitre</div>
  <div class="card">
    <div style="font-family:'Cinzel Decorative', serif;font-size:19px;text-align:center;margin-bottom:14px;">${t.title}</div>
    <div class="reading-body">${bodyHtml}</div>
    ${banner}
    ${qHtml}
    <div class="btn-row">
      ${locked ? "" : `<button class="next-btn" id="submitBtn">Remettre à l'enseignant</button>`}
      ${st.status === "soumis" ? `<button class="next-btn secondary" id="editBtn">Modifier mes réponses</button>` : ""}
    </div>
  </div>`;

  document.getElementById("backToChapter").addEventListener("click", () => { view = {mode:"chapter", ch}; render(); });

  app.querySelectorAll("textarea").forEach(ta => {
    ta.addEventListener("input", () => { st.answers[ta.dataset.q] = ta.value; });
  });

  t.questions.forEach(q => { if(q.type === "matching") wireMatching(q, st, locked); });

  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn) submitBtn.addEventListener("click", () => {
    st.status = "soumis";
    notifyParent();
    render();
  });
  const editBtn = document.getElementById("editBtn");
  if(editBtn) editBtn.addEventListener("click", () => {
    st.status = "a-faire";
    render();
  });
}

/* ---------------- Writing / composition view ---------------- */
function renderWritingView(ci, ti){
  const chapter = DATA[ci];
  const t = chapter.texts[ti];
  const st = ensureState(ci, ti);
  const locked = st.status !== "a-faire";

  if(st.promptIdx === null && t.prompts.length === 1) st.promptIdx = 0;

  let banner = "";
  if(st.status === "soumis") banner = `<div class="status-banner soumis">⏳ Remis — en attente de correction par l'enseignant.</div>`;
  if(st.status === "reussi") banner = `<div class="status-banner reussi">✅ Réussi !</div>`;

  let inner = "";

  if(st.promptIdx === null){
    // Choice screen
    inner += `<p style="margin-bottom:14px;">${t.instructions}</p>`;
    t.prompts.forEach((p, pi) => {
      inner += `<div class="prompt-card">
        <h4>${p.title}</h4>
        <p>${p.body}</p>
        <button class="next-btn" data-choose="${pi}">Choisir ce sujet</button>
      </div>`;
    });
  } else {
    const p = t.prompts[st.promptIdx];
    inner += `<div class="chosen-prompt">
      <h4>${p.title}</h4>
      <p>${p.body}</p>
      ${(locked || t.prompts.length === 1) ? "" : `<div class="change-prompt-link" id="changePromptLink">Changer de sujet</div>`}
    </div>`;
    inner += `<p class="write-hint">Objectif : ${t.wordTarget} mots. Une fois ton brouillon terminé, relis-toi : souligne les groupes du nom et entoure les adjectifs directement dans le texte ci-dessous.</p>`;
    if(!locked){
      inner += `<div class="write-toolbar">
        <button type="button" class="underline-btn" id="underlineBtn">Souligner (groupe du nom)</button>
        <button type="button" class="circle-btn" id="circleBtn">Entourer (adjectif)</button>
        <button type="button" id="clearMarkBtn">Effacer le marquage</button>
        <span class="word-counter" id="wordCounter">0 / ${t.wordTarget} mots</span>
      </div>`;
    } else {
      inner += `<div class="write-toolbar"><span class="word-counter">${countWords(st.content)} / ${t.wordTarget} mots</span></div>`;
    }
    inner += `<div class="write-editor" id="writeEditor" contenteditable="${locked ? "false" : "true"}">${st.content || ""}</div>`;
  }

  app.innerHTML = `<div class="back-link" id="backToChapter">← Retour aux textes du chapitre</div>
  <div class="card">
    <div style="font-family:'Cinzel Decorative', serif;font-size:19px;text-align:center;margin-bottom:14px;">${t.title}</div>
    ${banner}
    ${inner}
    <div class="btn-row">
      ${(!locked && st.promptIdx !== null) ? `<button class="next-btn" id="submitBtn">Remettre à l'enseignant</button>` : ""}
      ${st.status === "soumis" ? `<button class="next-btn secondary" id="editBtn">Modifier mon texte</button>` : ""}
    </div>
  </div>`;

  document.getElementById("backToChapter").addEventListener("click", () => { view = {mode:"chapter", ch:ci}; render(); });

  app.querySelectorAll("[data-choose]").forEach(btn => {
    btn.addEventListener("click", () => { st.promptIdx = parseInt(btn.dataset.choose, 10); render(); });
  });

  const changeLink = document.getElementById("changePromptLink");
  if(changeLink) changeLink.addEventListener("click", () => { st.promptIdx = null; st.content = ""; render(); });

  const editor = document.getElementById("writeEditor");
  const counter = document.getElementById("wordCounter");
  if(editor && !locked){
    editor.addEventListener("input", () => {
      st.content = editor.innerHTML;
      const n = countWords(st.content);
      if(counter){
        counter.textContent = n + " / " + t.wordTarget + " mots";
        counter.classList.toggle("ok", n >= t.wordTarget);
      }
    });
    const keepSelection = (e) => e.preventDefault();
    const underlineBtn = document.getElementById("underlineBtn");
    const circleBtn = document.getElementById("circleBtn");
    const clearBtn = document.getElementById("clearMarkBtn");
    if(underlineBtn){
      underlineBtn.addEventListener("mousedown", keepSelection);
      underlineBtn.addEventListener("click", () => {
        editor.focus();
        document.execCommand("underline");
        st.content = editor.innerHTML;
      });
    }
    if(circleBtn){
      circleBtn.addEventListener("mousedown", keepSelection);
      circleBtn.addEventListener("click", () => {
        editor.focus();
        const sel = window.getSelection();
        if(sel && sel.rangeCount > 0 && !sel.isCollapsed){
          const range = sel.getRangeAt(0);
          try {
            const span = document.createElement("span");
            span.className = "circled";
            range.surroundContents(span);
            sel.removeAllRanges();
          } catch(e) {
            alert("Sélectionne un seul mot ou groupe de mots simple, sans chevaucher un autre marquage.");
          }
          st.content = editor.innerHTML;
        }
      });
    }
    if(clearBtn){
      clearBtn.addEventListener("click", () => {
        editor.innerHTML = editor.innerHTML
          .replace(/<\/?u>/g, "")
          .replace(/<span class="circled">/g, "")
          .replace(/<\/span>/g, "");
        st.content = editor.innerHTML;
      });
    }
  }

  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn) submitBtn.addEventListener("click", () => {
    st.status = "soumis";
    notifyParent();
    render();
  });
  const editBtn = document.getElementById("editBtn");
  if(editBtn) editBtn.addEventListener("click", () => {
    st.status = "a-faire";
    render();
  });
}

/* ---------------- Panneau enseignant ---------------- */
function renderTeacherList(){
  const list = document.getElementById("teacherList");
  let items = [];
  DATA.forEach((chapter, ci) => {
    if(chapter.placeholder || chapter.special || chapter.isInvocations || chapter.isConjurations) return;
    chapter.texts.forEach((t, ti) => {
      if(t.placeholder) return;
      const st = ensureState(ci, ti);
      if(st.status === "soumis") items.push({ci, ti, title: t.title});
    });
  });
  if(items.length === 0){
    list.innerHTML = `<p class="empty-note">Aucun texte en attente de correction.</p>`;
    return;
  }
  list.innerHTML = items.map(it => `<div class="teacher-item">
      <div class="ti-title">${it.title}</div>
      <button class="approve" data-ci="${it.ci}" data-ti="${it.ti}" data-action="approve">Marquer réussi</button>
      <button class="reject" data-ci="${it.ci}" data-ti="${it.ti}" data-action="reject">Renvoyer</button>
    </div>`).join("");
  list.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const ci = parseInt(btn.dataset.ci,10), ti = parseInt(btn.dataset.ti,10);
      const st = ensureState(ci, ti);
      st.status = (btn.dataset.action === "approve") ? "reussi" : "a-faire";
      notifyParent();
      render();
    });
  });
}

const teacherPanel = document.getElementById("teacherPanel");
document.addEventListener("keydown", (e) => {
  if(e.ctrlKey && e.shiftKey && (e.key === "M" || e.key === "m")) teacherPanel.classList.add("open");
});
document.getElementById("closeTeacher").addEventListener("click", () => teacherPanel.classList.remove("open"));
document.getElementById("unlockAllBtn").addEventListener("click", () => {
  window.__toutDebarre = true;   // ouvre aussi les chapitres dont le précédent n'est pas terminé (Invocations et Conjurations sont enregistrées : rien à marquer)
  DATA.forEach((chapter, ci) => {
    if(chapter.placeholder || chapter.special || chapter.isInvocations || chapter.isConjurations) return;
    chapter.texts.forEach((t, ti) => { if(!t.placeholder) ensureState(ci, ti).status = "reussi"; });
  });
  teacherPanel.classList.remove("open");
  notifyParent();
  render();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  textState = {};
  view = {mode:"toc"};
  teacherPanel.classList.remove("open");
  notifyParent();
  render();
});

/* Auto-open a specific text when embedded with ?open=N (chapter 1 only, used by the global hub) */
const openParam = new URLSearchParams(window.location.search).get("open");
if(openParam !== null && !isNaN(parseInt(openParam, 10)) && DATA[0] && DATA[0].texts){
  const idx = parseInt(openParam, 10);
  if(idx >= 0 && idx < DATA[0].texts.length) view = {mode:"text", ch:0, text: idx};
}

app.innerHTML = '<p style="text-align:center;color:var(--ink-soft);">Chargement…</p>';
(async () => {
  try{ await Promise.all([chargerPromotions(), chargerToutesConj(), calculerInvocationsTerminees()]); }
  catch(e){ /* on affiche quand même la table des matières */ }
  render();
  promouvoirRang();   // met à jour les XP (et le rang) du coffre d'après les progressions déjà enregistrées
})();
</script>
