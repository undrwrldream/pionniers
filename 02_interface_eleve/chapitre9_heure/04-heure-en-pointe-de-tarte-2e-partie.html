<script>
/* Affichage sur le parchemin : quand le document est ouvert DANS le Grimoire (dans un cadre), on rend son fond transparent.
   C'est écrit ici, dans le document, pour que ça marche même quand le projet est ouvert depuis un dossier (file://). */
try{ if(window.self !== window.top) document.documentElement.classList.add('dans-grimoire'); }catch(e){ document.documentElement.classList.add('dans-grimoire'); }
</script>
<style id="grimoire-parchemin">
  html.dans-grimoire, html.dans-grimoire body{ background: transparent !important; }
  html.dans-grimoire #root > div{ background: transparent !important; min-height: 0 !important; }
  html.dans-grimoire #root header[class*="sticky"]{ display: none !important; }
  html.dans-grimoire #root main{ max-width: min(100%, 1180px) !important; background: rgba(255,250,236,0.62); border-radius: 18px; margin-top: 10px; margin-bottom: 10px; }
  html.dans-grimoire #root main > div:first-child{ padding-top: 28px !important; }
</style>
</head>

<script>
/* Suivi de lecture pour le Grimoire : le document compte comme « lu » quand
   l'élève a fait défiler chacune des 2 sections jusqu'à sa fin, puis a atteint
   le pied de page. Un simple saut tout en bas ne suffit pas.
   L'état (parties vues + position) est envoyé au Grimoire, qui le conserve :
   en revenant, l'élève reprend là où il en était. */
(function(){
  var TOTAL = 3, vus = {}, nbVus = 0, termine = false, minuterie = null;
  var init = window.__etatDoc;
  if(init && init.vus){ init.vus.forEach(function(i){ if(!vus[i]){ vus[i] = true; nbVus++; } }); }
  function poster(type, extra){
    try{ window.parent.postMessage(Object.assign({source:'grimoire-doc', type:type}, extra||{}), '*'); }catch(e){}
  }
  function etat(){ return { vus: Object.keys(vus).map(Number), y: Math.round(window.scrollY) }; }
  function envoyerEtat(){ poster('etat', { etat: etat() }); }
  function planifierEtat(){
    if(minuterie) return;
    minuterie = setTimeout(function(){ minuterie = null; envoyerEtat(); }, 800);
  }
  function cibles(){
    var ids = ['ch3','ch4'];
    var els = ids.map(function(id){ return document.getElementById(id); });
    var pied = document.querySelector('footer');
    if(els.some(function(e){ return !e; }) || !pied) return null;
    return els.concat([pied]);
  }
  function verifier(liste){
    var avant = nbVus;
    liste.forEach(function(el, i){
      if(vus[i]) return;
      var r = el.getBoundingClientRect();
      // le BAS de la section est entré dans l'écran (et n'est pas déjà passé au-dessus)
      if(r.bottom > 0 && r.bottom <= window.innerHeight + 2){ vus[i] = true; nbVus++; }
    });
    poster('progress', { vus: nbVus, total: TOTAL });
    if(nbVus !== avant) envoyerEtat();
    if(!termine && nbVus >= TOTAL){ termine = true; poster('termine'); }
  }
  function demarrer(){
    var liste = cibles();
    if(!liste){ return false; }
    var occupe = false;
    function surScroll(){
      planifierEtat();
      if(occupe) return; occupe = true;
      requestAnimationFrame(function(){ occupe = false; verifier(liste); });
    }
    if(init && init.y){ window.scrollTo(0, init.y); }
    window.addEventListener('scroll', surScroll, { passive:true });
    window.addEventListener('resize', surScroll);
    verifier(liste);
    return true;
  }
  var essais = 0, t = setInterval(function(){
    if(demarrer() || ++essais > 100){ clearInterval(t); }
  }, 150);
})();
</script>
